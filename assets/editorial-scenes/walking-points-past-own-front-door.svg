  <title>歩くポイントを優先し、家の前を通り過ぎる父親</title>
  <desc>夕暮れの住宅街。買い物袋を腕に提げた父親はスマートフォンの歩行ポイントを見ながら、開いた自宅の門を通り越して左へ歩く。空いた片手で、窓辺から手を振る娘に返事する。暖かい室内には夕食の皿が待つ。</desc>

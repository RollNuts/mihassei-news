<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="満杯の宅配ロッカーがあるマンションの玄関へ、配送用段ボールを載せた台車で荷物を運ぶ住民の列の創作イラスト" data-visual-topic="parcel" data-article-sha256="17b1c316658f4bedad9cf1269d3374b7b4ec1a27ad4699955c459a0966480757">
<title>再配達の代わりに、住民が運ぶ荷物</title>
<desc>マンションの玄関前。宅配ロッカーは全ての区画に荷物が入り、赤い使用中ランプが付いている。普段着の住民三人が、梱包テープと無記入の白い配送ラベルが付いた茶色の段ボール箱を折りたたみ台車に積み、建物へ運ぶ列を作る。玄関脇には無記入の用紙を掲示した共用掲示板。買い物袋、文字、数字、企業ロゴ、実在人物は描かない。</desc>

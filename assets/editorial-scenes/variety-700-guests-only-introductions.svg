<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="テレビの収録セットで司会者が普通の進行カードを読み、後ろで出演者たちが紹介を待ち、閉じたゲーム道具箱が脇に残る創作イラスト" data-visual-topic="gaming" data-article-sha256="419901cadd8ada4513eddb745150e253ff814ffbffa352acea33548212a168da">
  <title>進行カードを読み続ける司会者と、紹介を待つ出演者</title>
  <desc>普通のテレビ収録セットで、司会者が片手のマイクへ話しながら、もう片手に持った小さな進行カードを読む。後ろの出演者たちは腕を組んで紹介を待ち、脇には輪や球を入れた透明なふた付きのゲーム道具箱が閉じたまま置かれる。番組カメラがこの場面を撮っている。巨大な巻紙や看板、読める文字、実在番組名は描かず、大人数の架空の出演者の一部を切り取った創作イラストとする。</desc>

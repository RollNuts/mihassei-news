<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"
     aria-label="苦手なシナモンラテを持つ常連客に、カフェ店主が同じラテと無期限の無料券を差し出す創作イラスト"
     data-visual-topic="document" data-article-sha256="d8cf7a83f974daa1d5588d8c1cf13ace6535cfafbafbf4872b917df8b211a638">
  <title>断れないいつもの一杯と、生涯無料券</title>
  <desc>木のカウンターに座る常連客は、シナモンの浮かぶラテを手に持ち、肩をすくめて気まずそうに口を結んでいる。エプロン姿の店主は、同じラテをもう一杯と、無限大の記号だけが付いた無料券を差し出す。カウンターの端には手を付けていない紅茶、中央にはシナモンの瓶とスティック。文字、ブランド、実在人物は描かない。</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f3e9d9"/><stop offset="1" stop-color="#ddc8ab"/></linearGradient>
    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#bd8c5c"/><stop offset="1" stop-color="#93653f"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#dce5df"/><stop offset="1" stop-color="#b3c9c1"/></linearGradient>
  </defs>

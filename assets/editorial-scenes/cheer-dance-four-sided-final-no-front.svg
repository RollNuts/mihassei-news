<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="創作イラスト：四方の客席に向かい、中央を空けて踊る十二人のチアダンス選手" data-visual-topic="newspaper" data-article-sha256="c94884aa6566ad7f74757590e63ec36e6e5ce4ddac8396e6a1d5d68fc55d496a">
<title>四方へ踊る、正面のないチアダンス</title>
<desc>正方形のフロアの四方に観客が座る。十二人の選手は三人ずつ四組に分かれ、それぞれ違う客席へポンポンを上げて踊り、中央に広い空間を残す。競技会場を上から見た創作イラスト。</desc>

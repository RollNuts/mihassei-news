<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
     role="img" aria-label="カフェの隣の卓へ話しかけた男性を、間に入った店員が手のひらで穏やかに制止し、二つのコーヒー卓と入口の待ち客が見える創作イラスト"
     data-visual-topic="movie" data-article-sha256="dc71ac166967d3e3b31cdcd3bf2e7e077f9885ad5479d2edeff3b9d250ce73f6">
  <title>予約された偶然の相席</title>
  <desc>カフェの別々の小卓に座る二人の客。左の男性が隣の客へ手を上げて話しかけると、間に立つエプロン姿の店員が真顔で手のひらを向けて穏やかに制止する。二人の客は互いの方を向き、それぞれの卓には普通のコーヒーが置かれる。店員は配膳や会計をせず、もう片方の手は腰元へ添えている。入口には次の客が待つ。予約票、台帳、読める文字、ロゴ、実在人物は描かない。</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f3e9d9"/><stop offset="1" stop-color="#d9c4a6"/></linearGradient>
    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#b68153"/><stop offset="1" stop-color="#845936"/></linearGradient>
  </defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="狭い漁港の岸壁で、漁船を撮る旅行者の三脚に道をふさがれ、縄を運ぶ漁師が立ち止まる創作イラスト" data-visual-topic="document" data-article-sha256="76c8e190023eb39c7eadeb358477d57021f15ba90d9a30d822854adc102023f4">
<title>穴場を撮る列が、漁師の仕事道をふさぐ</title>
<desc>小さな漁港の朝。水に浮く作業用の漁船へ向け、背中をこちらに向けた旅行者がスマートフォンとカメラを構えている。狭いコンクリートの岸壁には三脚が広がり、作業着と長靴の漁師が抱えた漁業用ロープの束を運べず立ち止まる。人物の足と三脚はすべて岸壁上。読める文字、ロゴ、案内画面、数字やカウンターは描かない。</desc>

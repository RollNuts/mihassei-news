<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
 aria-label="同じ大豆を仕込んだ二つの発酵槽から別々に試料を採り、検査と熟成の調整を経て、淡い色と濃い色の二種類のみそを別々の器に盛る創作イラスト"
 data-visual-topic="robot" data-article-sha256="72fdd268deee1c4dda4ac92f03846495e4c15772db0e4e7746c8964d9b664752">
<title>同じ仕込みの二槽を別々に調べ、二つの味のみそとして出荷する</title>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#e7ede9"/><stop offset="1" stop-color="#cdd9d3"/></linearGradient>
 <linearGradient id="steel" x2="1" y2="0"><stop stop-color="#82999a"/><stop offset=".35" stop-color="#e5eeeb"/><stop offset=".7" stop-color="#b9cac5"/><stop offset="1" stop-color="#809795"/></linearGradient>
 <linearGradient id="vat-top" x2="0" y2="1"><stop stop-color="#f4f6ed"/><stop offset="1" stop-color="#c0d0c9"/></linearGradient>
 <linearGradient id="light-miso" x2="0" y2="1"><stop stop-color="#d8b366"/><stop offset="1" stop-color="#ad7f39"/></linearGradient>
 <linearGradient id="dark-miso" x2="0" y2="1"><stop stop-color="#af613e"/><stop offset="1" stop-color="#773c2d"/></linearGradient>
 <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto"><path d="M3 3 18 11 3 19" fill="none" stroke="#657f74" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#wall)"/>

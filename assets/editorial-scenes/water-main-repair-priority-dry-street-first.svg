<title>水が漏れる前に、管の継ぎ目を確かめる</title>
<desc>住宅街の乾いた舗装を一部開いた作業区画。作業灯の下で職員が露出した水道管の傷んだ継ぎ目を指し、別の職員が記録と照合する。住民は柵の外から見守る。水たまりや噴水はない。</desc>

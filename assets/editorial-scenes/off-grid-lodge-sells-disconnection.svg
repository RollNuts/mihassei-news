<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="森が見える山の宿の受付で、普段着の客がスマートフォンを開いた小さな金属箱へ置き、女将が見守る創作イラスト" data-visual-topic="telephone" data-article-sha256="3961dddb7d9b97a91290a88bf5771dfd88e28c6887118a9adacb50ba9f782368">
<title>山の宿でスマホを預ける、小さな金属箱</title>
<desc>木製カウンターのある山の宿の受付。客が片手で持ったスマートフォンを、机上の小さな可搬式の金属箱へ静かに下ろしている。長方形の電話と画面、上に開いた金属製のふた、空いた箱の内側が同時に見える。箱はカウンターに組み込まれた引き出しではない。女将はカウンターの向こうでその手元を見守り、窓から普通の森と山並みが見える。画像内に文字、ロゴ、架空ブランド、通知文は描かない。</desc>

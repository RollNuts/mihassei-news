<linearGradient id="lodge-floor" x2="0" y2="1"><stop stop-color="#c9b99f"/><stop offset="1" stop-color="#b09a7e"/></linearGradient>
<linearGradient id="lodge-metal" x2="0" y2="1"><stop stop-color="#d9dfd7"/><stop offset="1" stop-color="#b4c1b9"/></linearGradient>
</defs>

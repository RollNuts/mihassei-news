<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="観客がスマートフォンで投票するAR球技の決勝。ゴーグルと腕センサーを着けた選手が放った光球が、相手の光の盾の上側を大きく回り込む創作イラスト" data-visual-topic="document" data-article-sha256="5ade3118ca127a973d48b9ac2a7d2e9e06853fcc67ac9572f87c95ffd1f121f5">
  <title>客席が選ぶ横風、盾を回り込む一球</title>
  <desc>屋内コートの左側で、青緑のユニフォームの選手が横へ踏み込み、腕のセンサーを前に向けて投げる。右側の赤いユニフォームの相手は半透明の光の盾を正面に立てるが、水色の光球は高い曲線を描いて盾の外側を回り込む。奥の客席では複数の観客がスマートフォンを持つ。光球・軌道・盾はAR越しの競技を表した描写で、現実の風や物理的な球を描いた写真ではない。読み取れる文字・ロゴ・実在人物はない。</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#e2e7df"/><stop offset="1" stop-color="#f0eee4"/></linearGradient>
    <linearGradient id="court" x2="0" y2="1"><stop stop-color="#e4ddcc"/><stop offset="1" stop-color="#f2eadb"/></linearGradient>
    <linearGradient id="shield" x2="1" y2="0"><stop stop-color="#60bec0" stop-opacity=".12"/><stop offset="1" stop-color="#268c9b" stop-opacity=".3"/></linearGradient>
    <radialGradient id="ball"><stop stop-color="#fffdf2"/><stop offset=".42" stop-color="#ccf0e3"/><stop offset="1" stop-color="#4fb4ba"/></radialGradient>
  </defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
 aria-label="セールの前夜祭で買い物を終えた客が空の財布を見せ、店員が遠くの本番セール装飾を指す商店街の創作イラスト"
 data-visual-topic="document" data-article-sha256="413d16b8114175e029c914f8b4469577de285e345e4dff86b7b0e527fdd407ae">
<title>前夜祭で予算を使い切り、買い物袋に囲まれて本番を見学する客</title>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e3e7df"/><stop offset="1" stop-color="#fff0d8"/></linearGradient>
 <linearGradient id="shop" x2="0" y2="1"><stop stop-color="#a7b9b5"/><stop offset="1" stop-color="#657e7b"/></linearGradient>
 <linearGradient id="road" x2="0" y2="1"><stop stop-color="#d2c7b5"/><stop offset="1" stop-color="#b4afa5"/></linearGradient>
 <filter id="shadow" x="-25%" y="-30%" width="150%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#55504b" flood-opacity=".20"/></filter>
</defs>
<!-- Quiet neighborhood shopping street in early evening -->
<rect width="1200" height="675" fill="url(#sky)"/>
<rect x="0" y="263" width="1200" height="412" fill="url(#road)"/>
<path d="M0 282H1200" stroke="#c2ad91" stroke-width="10"/>
<path d="M0 620H1200" stroke="#e6d9c9" stroke-width="6" opacity=".8"/>
<!-- Stores with gentle early-evening light and blank sale decorations -->
<g stroke="#6f7976" stroke-width="3">
 <rect x="0" y="101" width="365" height="174" fill="#d8cab5"/>
 <rect x="365" y="75" width="443" height="203" fill="#b1beb7"/>
 <rect x="807" y="109" width="393" height="166" fill="#c5bba8"/>
 <rect x="37" y="151" width="240" height="118" fill="#e7d9b8"/>
 <rect x="410" y="131" width="331" height="139" fill="url(#shop)"/>
 <rect x="850" y="158" width="289" height="112" fill="#d2ba9d"/>
</g>
<g fill="#e5e9df" opacity=".82"><path d="M37 152h240v35H37z"/><path d="M410 131h331v41H410z"/><path d="M850 159h289v37H850z"/></g>
<g fill="none" stroke="#eee8d9" stroke-width="7"><path d="M158 189v79M584 173v96M992 195v75"/></g>
<!-- Successive flags imply a sale still stretching ahead without any words -->
<path d="M26 57Q575 144 1172 55" stroke="#a08a77" stroke-width="4" fill="none"/>
<g fill="#bf7355"><path d="M67 62l34 5-22 37z"/><path d="M224 86l34 5-21 37z"/><path d="M378 101l33 3-17 35z"/><path d="M719 93l34-5-13 39z"/><path d="M1042 65l37-7-12 41z"/></g>
<g fill="#ead7a7"><path d="M138 73l35 5-19 36z"/><path d="M301 96l35 3-17 37z"/><path d="M556 107l34-1-14 37z"/><path d="M891 78l34-6-13 38z"/></g>
<!-- Bench: one tired shopper, feet firmly on the ground -->
<g filter="url(#shadow)"><rect x="167" y="435" width="441" height="24" rx="7" fill="#8b755f"/>
<rect x="190" y="464" width="16" height="103" fill="#716458"/><rect x="571" y="464" width="16" height="103" fill="#716458"/>
<rect x="170" y="369" width="435" height="19" rx="9" fill="#9b8169"/><path d="M188 380V444M592 380V444" stroke="#7e6b5a" stroke-width="12"/></g>

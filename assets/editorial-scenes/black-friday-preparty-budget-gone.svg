<path d="M405 433l53-14 18 48-63 21z" fill="#655348" stroke="#40382f" stroke-width="3"/>
<path d="M404 435l8 48" stroke="#d0b8a0" stroke-width="3"/><path d="M359 433l30 8m26 4l40-12" stroke="#c6aa88" stroke-width="2" opacity=".6"/></g>
<!-- Checked-off shopping list on bench; no fake readable lettering -->
<g transform="rotate(-10 210 410)" filter="url(#shadow)"><rect x="175" y="390" width="79" height="61" rx="3" fill="#fff6dc"/><path d="M190 400l7 8 10-15m-16 25l6 7 10-14m-15 24l7 6 10-15" fill="none" stroke="#af6258" stroke-width="3"/><path d="M214 406h29m-29 16h28m-29 16h21" stroke="#8b968c" stroke-width="2"/></g>

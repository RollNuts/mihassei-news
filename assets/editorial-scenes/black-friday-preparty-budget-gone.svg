<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="炊飯器売場で空の財布を開く買い物客と、毛布と靴が見える購入済みの買い物袋、棚に残る炊飯器を描いた創作イラスト" data-visual-topic="document" data-article-sha256="d92d8eb811828f5a9c956e5baf90d6b0c383d2d088bd733f47b170e507b8604f">
<title>毛布と靴は買ったのに、炊飯器の前で空になった財布</title>
<desc>普通の家電売場で、成人の客が両手で財布を開き、何も入っていない内側へ目を落としている。足元の無地の買い物袋からは折り畳んだ毛布と新しい靴の一足が見える。買い替えたかった炊飯器は客の荷物にはなく、店の陳列棚に置かれたまま。人物は普段着で、店員、セール旗、値札の文字、家電を購入した箱は描かない。画像内に数字、ロゴ、実在ブランドはない。</desc>
<defs>
<linearGradient id="sale-wall" x2="0" y2="1"><stop stop-color="#e9e4d7"/><stop offset="1" stop-color="#d7d3c4"/></linearGradient>
<linearGradient id="sale-floor" x2="0" y2="1"><stop stop-color="#d0c9b6"/><stop offset="1" stop-color="#b8b4a0"/></linearGradient>
</defs>

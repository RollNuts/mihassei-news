<ellipse cx="170" cy="587" rx="124" ry="17" fill="#a09385" opacity=".25"/>
<g filter="url(#shadow)"><rect x="29" y="460" width="133" height="109" rx="3" fill="#ba946d" stroke="#84684d" stroke-width="4"/>
<path d="M31 478l64-24 67 23M95 455v114" stroke="#907254" stroke-width="4" fill="none"/>
<rect x="44" y="496" width="101" height="47" fill="#dbc4a2"/>
<path d="M61 521h60m-47-13l39 25m0-25l-39 25" stroke="#9b8d78" stroke-width="3"/>
<path d="M163 491h84l-6 78h-84z" fill="#e9dbca" stroke="#af997d" stroke-width="3"/>
<path d="M177 495q0-46 31-44 30 2 26 44" fill="none" stroke="#9b8d77" stroke-width="7"/>
<path d="M168 539q32-9 72-3" stroke="#c2a886" stroke-width="9"/>
<path d="M471 521h120l5 53H466z" fill="#b98d6a" stroke="#8e6b52" stroke-width="3"/>
<path d="M479 521l41-29h64l-34 29z" fill="#d5b18c" stroke="#927257" stroke-width="3"/>
<path d="M518 499v20" stroke="#927257" stroke-width="6"/>

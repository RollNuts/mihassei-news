<path d="M611 486q1-37 25-39 24 2 29 39" stroke="#a7957d" stroke-width="7" fill="none"/>
<path d="M610 532h54" stroke="#c6ac82" stroke-width="15"/>
</g>
<!-- Cheerful clerk invites shoppers further on, from a distance -->
<ellipse cx="926" cy="577" rx="80" ry="17" fill="#a2988c" opacity=".25"/>
<path d="M887 379q-20 15-23 63l-6 84h124l-8-100q-11-53-60-58z" fill="#aa745f" stroke="#815547" stroke-width="4"/>
<path d="M898 516l-12 53h33l16-53zM935 516l4 54h34l-5-54z" fill="#5e6b6c"/>
<path d="M879 567h40v17h-50zM939 569h35l15 15h-51z" fill="#645650"/>
<path d="M896 308q9-40 42-32 46 10 37 67l-28 28-42-11z" fill="#d6ab89" stroke="#9b795f" stroke-width="3"/>
<path d="M898 319q-14-50 32-53 29-1 38 25-26 7-44-5-4 18-26 33" fill="#494b4a"/>
<path d="M921 338h7m27 1h7" stroke="#674e42" stroke-width="4" stroke-linecap="round"/>
<path d="M929 353q14 11 28 0" stroke="#a0705a" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M968 415q33 7 55-24l74-58" fill="none" stroke="#d6aa89" stroke-width="22" stroke-linecap="round"/>
<circle cx="1096" cy="333" r="14" fill="#d6aa89"/>
<path d="M870 420l-15 76" stroke="#d6aa89" stroke-width="20" stroke-linecap="round"/>
<!-- Distant unspent shopping opportunities remain beneath the flags -->
<path d="M1105 285h92v87h-92z" fill="#c3d0c3" stroke="#86978b" stroke-width="3"/>
<path d="M1108 293l22 23 22-23 22 23 22-23" fill="none" stroke="#c77e5f" stroke-width="7"/>
<circle cx="1155" cy="353" r="18" fill="#c77e5f" opacity=".65"/>
</svg>
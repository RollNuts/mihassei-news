<path d="M297 570h59v17h-67q-8-3 8-17M411 567h68v18h-71z" fill="#66524b"/>
<path d="M345 310q-3-47 46-52 53-4 56 51l-8 29-29 23-40-8-28-20z" fill="#d7a985" stroke="#9c795f" stroke-width="3"/>
<path d="M341 293q10-57 68-50 36 5 40 46-21 2-42-16-25 20-67 20" fill="#3b4246"/>
<path d="M371 315l11 2M416 315l10-2" stroke="#604c44" stroke-width="4" stroke-linecap="round"/>
<path d="M384 339q12 5 24-2" fill="none" stroke="#8b655c" stroke-width="3" stroke-linecap="round"/>
<!-- Shopper shows an unmistakably empty open wallet -->
<path d="M339 393q-49 0-53 34l55 28 26-28z" fill="#d5a282" stroke="#94705f" stroke-width="3"/>
<path d="M435 390q35 7 43 33l-66 27-13-23z" fill="#d5a282" stroke="#94705f" stroke-width="3"/>

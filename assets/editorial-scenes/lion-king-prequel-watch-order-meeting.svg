<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
 aria-label="夜の居間で映画を見る順番を議論し続ける家族と、放送終了の画面が映るテレビを描いた創作イラスト"
 data-visual-topic="meeting" data-article-sha256="5b32a2b07ac7fd32132912f798e53b8bbb580de32a057c8ff09aa20bd0b75078">
<title>映画を見る順番の図だけが完成、テレビはすでに放送終了</title>
<defs>
 <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ede9df"/><stop offset="1" stop-color="#d6d2c9"/></linearGradient>
 <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b19d86"/><stop offset="1" stop-color="#806e60"/></linearGradient>
 <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#293d52"/><stop offset="1" stop-color="#111f31"/></linearGradient>
 <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#1f3b47"/><stop offset="1" stop-color="#16242d"/></linearGradient>
 <linearGradient id="table" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#c6a27b"/><stop offset="1" stop-color="#926b4f"/></linearGradient>
 <filter id="shade" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#5b4a40" flood-opacity=".2"/></filter>
</defs>

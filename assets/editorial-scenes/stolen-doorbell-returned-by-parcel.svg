<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"
      width="1200" height="675" role="img" aria-label="閉じた店の入口と呼び鈴の外れた取付跡、呼び鈴入りの宅配箱を持つ配達員、ドアに残された不在票を描いた編集部制作の創作イラスト"
      data-visual-topic="doorbell" data-article-sha256="ecd1cb53929ef2271c2b14273da1a681c275a7e8be1e57bb3b8b332e9489411d">
      <title>呼び鈴が戻ってきた店先</title>
      <desc>閉じたドアの横には空の取付跡。配達員がそこへ手を伸ばし、
      もう片方の腕に抱えた宅配箱からは返された呼び鈴がのぞいている。
      ドアの取っ手には不在票が残されている。実際の出来事を撮影した写真ではない。</desc>

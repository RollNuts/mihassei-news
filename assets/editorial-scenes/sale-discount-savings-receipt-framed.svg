<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="未開封の箱で狭くなった自宅の廊下で、父が壁の小さな額に入れた値引き欄の紙片を息子へ指して見せる創作イラスト" data-visual-topic="document" data-article-sha256="81ca078945698e90f2c2c5a3b09662e47da4ae30d12302fbdab299678f99bcf8">
<title>箱で埋まる廊下に飾った、値引き欄だけの節約成果</title>
<desc>自宅の玄関近くの廊下。父は息子へ、壁に掛けた普通サイズの小さな額を指して見せる。額の中にあるのはレシート全体ではなく、値引き欄だけを切り取った短い横長の白い紙片。二人のすぐ脇にはテープで封じられた家電の箱が積み上がり、未開封の箱で通り道が狭くなっている。紙片に読める文字や金額は描かず、箱にもロゴや品名はない。</desc>
<defs>
<linearGradient id="receipt-floor" x2="0" y2="1"><stop stop-color="#ead7c3"/><stop offset="1" stop-color="#c29e82"/></linearGradient>
<linearGradient id="receipt-paper" x2="0" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#e9e2d1"/></linearGradient>
</defs>

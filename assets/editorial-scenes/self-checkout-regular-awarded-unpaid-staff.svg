<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="セルフレジの常連男性が牛乳一本を持ちながら隣客のスキャンを手伝い、同じ男性の顔が月間優秀スタッフの表彰額に飾られている創作イラスト" data-visual-topic="document" data-article-sha256="dfe99daecdb1e7bdf8889502824ef6b1f2ded054a45a1137ed4a3cb11490aab3">
<title>セルフレジの無給スタッフ、買い物客なのに店内で表彰</title>
<desc>黄土色の服の男性が牛乳一本を持って別の客の会計を手伝う。背後の壁には同じ眼鏡の男性の肖像と金のリボンを掲げた表彰額。男性自身のレジには牛乳一本だけが残る。</desc>

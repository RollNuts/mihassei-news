<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="正面を特大熊手の撮影場所にした店で、店主はスマホを見つめ、買い物客は脇の狭い入口から離れていく創作イラスト" data-visual-topic="document" data-article-sha256="ec70546849b3ce4e90257f28c9c71f267a12252e14df0bbf737febf587e3c6ea">
<title>写真の行列と空いたレジ</title>
<desc>正面を大きな熊手が占め、店の外では二人がスマホで撮影する。脇の細い入口は開いているが、買い物袋を持つ客は入口から離れかけている。店内では店主がスマホの画面を確認し、レジ前には小さな伝票が三枚だけある。文字・ロゴ・実在人物を含まない架空の場面。</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9d8d6"/><stop offset="1" stop-color="#eff0e9"/></linearGradient>
<linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8c8ad"/><stop offset="1" stop-color="#a28a6e"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65817d" stop-opacity=".9"/><stop offset="1" stop-color="#294442"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5a85b"/><stop offset="1" stop-color="#9f6728"/></linearGradient>
</defs>

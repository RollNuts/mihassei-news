<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="市役所の窓口で職員が親子へノートパソコンの確認済み回答を示し、書類を案内する創作イラスト" data-visual-topic="meeting" data-article-sha256="e1c2866d8f64306224d4bef32503b45adbec6c292e99d85b5bfcc65586a316d2">

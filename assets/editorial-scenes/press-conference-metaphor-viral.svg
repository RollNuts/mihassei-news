<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="配信の会見映像は見えるのに、下の原因と復旧の説明欄だけが警告付きの不透明なUIで隠され、利用者が困惑する創作イラスト" data-visual-topic="security" data-article-sha256="0ae4893b3843b2c74d75bd33d16badbf39dd2a0ce4b1d9b861ef3166bfb3742c">
<title>会見は見えるのに、肝心の説明だけ隠れた配信画面</title>
<desc>左に通信障害説明会の配信画面を拡大して示す。動画内では普通のスーツ姿の話者がマイクに向かって説明しており、顔や映像は隠されていない。その下の原因と復旧方法を伝える説明欄だけを、不透明なUIパネルと小さな警告アイコンが覆っている。右では普段着の利用者が画面へ顔を向け、眉を寄せて戸惑う。読める文字を用いず、見られる会見と見えない必要情報の関係を表す説明用の創作イラスト。</desc>
<defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="最初の試合後に優勝旗を受け取った主将が旗竿を両手で持ち、係員が旗の布端を支えて説明し、後方に成人選手二人が立つ創作イラスト" data-visual-topic="document" data-article-sha256="5b48d4a5b3f1dd02bfbb426fdb781c016f07e74516bb7a9ec3141b7e4c32c39a">
  <title>最初の試合が終わり、優勝旗を受け取って戸惑う主将</title>
  <desc>普通の体育館のバスケットボールコート。試合後、主将は受け取った優勝旗の竿を両手で持つ。隣の係員は旗の布の端を片手で支え、主将へ説明している。旗には単純な星の飾りだけがあり、文字や数字、ロゴはない。後ろでは普段のユニフォーム姿の成人選手二人が見守る。巨大な数字や試合前の握手は描かない。</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#172e48"/><stop offset="1" stop-color="#354b60"/></linearGradient>
    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#f6dcaa"/><stop offset="1" stop-color="#dfaa69"/></linearGradient>
  </defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="誕生会の主役が両手で口元を覆って驚く一方、膝には開いた進行表が残り、ケーキを囲む友人の一人が撮影する創作イラスト" data-visual-topic="document" data-article-sha256="7e4845cf4553851c94b7cb7f8df4d0c76e7b9123236b787d5dd6a64c6f4d63de">
<title>驚く主役の膝に残った、自分の誕生会の進行表</title>
<desc>普通の飲食店の個室。主役の女性は椅子に座り、両手で口元を覆って大きく目を開いている。その膝の上には紙の進行表が二つ折りを開いたまま置かれ、記念撮影の画角から見えている。小さなろうそく付きケーキが卓上にあり、友人三人が祝う。一人はスマートフォンを主役へ向けて写真を撮っている。ケーキにも紙にも画面にも、読める文字、数字、ロゴは描かない。</desc>
<defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
 aria-label="廃洗濯機からモーターを取り出すロボットと、受け渡し台で部品を点検する作業員の創作イラスト"
 data-visual-topic="robot" data-article-sha256="43b8c0e4411cdbc89675a18186ce4794eddfb3bdd01a7e79d4cfd5cef024907f">
 <title>取り外したモーターを、点検して次の修理へ</title>
 <desc>安全柵で区切られた家電回収センター。前面を開いた廃洗濯機、モーターを受け渡し台へ運ぶ解体ロボット、検査器具を持つ成人の作業員を同じ場面に描いた、編集部制作の創作イラスト。</desc>

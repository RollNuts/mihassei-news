<title id="scene-title">救出用の道具をしまい、相棒の忘れた上着を畳む主人公</title>
<desc id="scene-desc">静かな隠れ家。縄のほどけた空の木椅子の隣で、真顔の成人が薄茶色の上着の袖を内側へ折っている。床の開いたバッグから、未使用のロープカッターが見える。</desc>

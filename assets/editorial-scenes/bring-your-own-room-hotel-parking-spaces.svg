<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="客室棟のない宿の駐車区画で、客が自分のバンの後部に布団を広げ、係員が駐車場の白線を指して案内する創作イラスト" data-visual-topic="document" data-article-sha256="4f72aa80f23dc36bcbf312e94806067fd55bb4724ccba0acab711168b4ed160f">
<title>駐車区画へ持参した、バンの中の客室</title>
<desc>昼の小さな宿泊施設の駐車場。無地の普通のバンが白線の内側に停まっている。上に開いた後部ハッチから車内の白い敷き布団と枕がはっきり見え、普段着の宿泊客が掛け布団を広げている。少し離れた係員は駐車区画の白線を指す。背景にある建物は受付や共用設備を収めた低い平屋だけで、客室の並ぶ棟はない。実在ホテル名、車ブランド、文字、ロゴは描かない。</desc>
<defs>
<linearGradient id="hotel-sky" x2="0" y2="1"><stop stop-color="#dce4dc"/><stop offset="1" stop-color="#eeeadc"/></linearGradient>
<linearGradient id="hotel-ground" x2="0" y2="1"><stop stop-color="#c5c8bb"/><stop offset="1" stop-color="#aeb9af"/></linearGradient>
</defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="空の有人レジで待つ店員をよそに、買い物袋を持つ客同士が長ネギを見ながら世間話をする創作イラスト" data-visual-topic="document" data-article-sha256="d7054eb08bb145bb56c0f12d99bcde4e0369bbad7f4f8eb3bfeb2cd560e112f2">
<title>会話の順番より先に、列の中でネギの話</title>
<desc>スーパーの有人レジ。店員は商品が一つもないカウンターの内側で客を待っている。会計後の売り場側では、買い物袋を下げた客同士が互いの方へ顔を向けて雑談し、もう一人の客も加わる。一つの袋からは白い茎と緑の葉の長ネギがのぞく。客は品物をレジへ渡さず、商品スキャンも会計も行われていない。画像内に文字、数字、ロゴ、吹き出し、操作画面は描かない。</desc>
<defs>
<linearGradient id="wall" x2="0" y2="1"><stop stop-color="#ecebdd"/><stop offset="1" stop-color="#d7dfd0"/></linearGradient>
<linearGradient id="floor" x2="0" y2="1"><stop stop-color="#e2dfd0"/><stop offset="1" stop-color="#c2cabc"/></linearGradient>
</defs>

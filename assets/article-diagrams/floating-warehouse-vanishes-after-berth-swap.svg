  <title id="harbor-diagram-title">浮き倉庫の移動</title>
  <desc id="harbor-diagram-desc">屋根付きの平たい船をタグボートが引き、鋼材ごと第3岸壁から東へ600メートル離れた第2岸壁へ移動。案内板だけが元の場所を示している。</desc>

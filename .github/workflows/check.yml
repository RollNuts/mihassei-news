name: Validate newspaper
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce editorial lane metadata and exact duplicate guards
        run: python3 scripts/editorial_mix.py --check
      - name: Install free local image validation dependency
        run: |
          if ! dpkg -s libcairo2 >/dev/null 2>&1; then
            sudo apt-get install --no-install-recommends -y libcairo2
          fi
          python3 -m pip install --no-cache-dir 'Pillow>=10.1,<13' CairoSVG==2.7.1
      - run: python3 -m unittest discover -s tests -v
        env:
          VERIPSA_TEST_REFERENCE_RENDERER: '1'
      - name: Verify original Buffer X feed and popular-article no-repost logic offline
        run: |
          python3 -m unittest discover -s social-bot/experiments -p 'test_dispatch.py' -v
          python3 -m unittest discover -s social-bot/article-picks -p 'test_dispatch.py' -v
      - name: Protect published mysteries and original market forecasts
        env:
          SERIAL_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/guard_serial_history.py "$SERIAL_BASE_SHA"
      - name: Guard generated JPEG provenance and exact integer seeds
        env:
          MEDIA_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/guard_generated_media_history.py "$MEDIA_BASE_SHA"
      - name: Warn about stale news sources and topic concentration (never blocks publishing)
        run: python3 scripts/audit_editorial.py
      - name: Validate free trend helper without network access
        run: python3 -m py_compile scripts/trend_brief.py scripts/editorial_mix.py
      - name: Review repeated satire templates and generic openings (advisory only)
        continue-on-error: true
        run: python3 scripts/audit_satire.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only public health checker
        run: python3 -m py_compile scripts/check_live.py
      - name: Build the static site with all image fallback routes
        run: python3 scripts/build.py
      - name: Report selected images and stale illustration reviews
        run: python3 scripts/visual_review.py
      - name: Audit all sitemap URLs and crawlable internal links (no APIs)
        run: python3 scripts/audit_search_index.py
      - name: Verify cached and late image failures recover without broken layouts
        run: node --test tests/image-fallback.test.cjs
      - name: Validate browser JavaScript
        run: |
          node --check assets/site.js
          node --check assets/engagement.js
          node --check assets/comments.js
          node --check assets/comment-activity.js
          node --check assets/bookmarks.js
          node --check assets/returning-shelf.js
          node --check assets/growth-desk.js
          node --check assets/serial-progress.js
          node --check assets/comments-admin.js
          node --check assets/news-broadcast.js
          node --input-type=module --check < src/comments.js
          node --input-type=module --check < src/worker.js
      - name: Verify news video captions, playback controls and image fallback
        run: node --test tests/news-broadcast.test.cjs
      - name: Verify private serial read/resume progress
        run: node --test tests/serial-progress.test.cjs
      - name: Verify reading progress follows article and serial text
        run: node --test tests/reading-progress.test.cjs
      - name: Verify Japan-date edition freshness (today vs old issue)
        run: node --test tests/edition-freshness.test.cjs
      - name: Test coarse privacy-safe attribution without network access
        run: node --test tests/attribution.test.cjs
      - name: Test archive filters and incremental browsing without network access
        run: node --test tests/archive-pagination.test.cjs tests/archive-tags.test.cjs
      - name: Test offline reader bookmarks with no network or accounts
        run: node --test tests/bookmarks.test.cjs
      - name: Test optional homepage return-to-bookmarks (privacy-safe)
        run: node --test tests/returning-shelf.test.cjs
      - name: Test genuine reader discovery without additional API calls
        run: node --test tests/reader-discovery.test.cjs
      - name: Test PV event deduplication, coverage and browser display
        run: node --test tests/pageviews.test.cjs tests/pageviews-ui.test.cjs
      - name: Test anonymous comments in SQLite without network access
        run: node --test tests/comments.test.cjs
      - name: Test future prediction voting with local SQLite (no paid API)
        run: node --test tests/future-poll.test.cjs
      - name: Verify Cloudflare Worker can be packaged without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/mihassei-worker

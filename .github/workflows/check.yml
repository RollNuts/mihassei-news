name: Validate newspaper
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Warn about stale news sources and topic concentration (never blocks publishing)
        run: python3 scripts/audit_editorial.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only public health checker
        run: python3 -m py_compile scripts/check_live.py
      - name: Validate browser JavaScript
        run: |
          node --check assets/site.js
          node --check assets/engagement.js
          node --check assets/comments.js
          node --check assets/comment-activity.js
          node --check assets/bookmarks.js
          node --check assets/growth-desk.js
          node --check assets/mystery-notes.js
          node --check assets/serial-progress.js
          node --check assets/comments-admin.js
          node --input-type=module --check < src/comments.js
          node --input-type=module --check < src/worker.js
      - name: Verify private serial read/resume progress
        run: node --test tests/serial-progress.test.cjs
      - name: Verify private on-device mystery notes
        run: node --test tests/mystery-notes.test.cjs
      - name: Verify Japan-date edition freshness (today vs old issue)
        run: node --test tests/edition-freshness.test.cjs
      - name: Test coarse privacy-safe attribution without network access
        run: node --test tests/attribution.test.cjs
      - name: Test archive filters and incremental browsing without network access
        run: node --test tests/archive-pagination.test.cjs
      - name: Test offline reader bookmarks with no network or accounts
        run: node --test tests/bookmarks.test.cjs
      - name: Test genuine reader discovery without additional API calls
        run: node --test tests/reader-discovery.test.cjs
      - name: Test anonymous comments in SQLite without network access
        run: node --test tests/comments.test.cjs
      - name: Test future prediction voting with local SQLite (no paid API)
        run: node --test tests/future-poll.test.cjs
      - name: Verify Cloudflare Worker can be packaged without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/mihassei-worker

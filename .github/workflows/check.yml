name: Validate newspaper
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only public health checker
        run: python3 -m py_compile scripts/check_live.py
      - name: Validate browser JavaScript
        run: |
          node --check assets/site.js
          node --check assets/engagement.js
          node --check assets/comments.js
          node --check assets/comment-activity.js
          node --check assets/comments-admin.js
          node --input-type=module --check < src/comments.js
          node --input-type=module --check < src/worker.js
      - name: Test archive filters and incremental browsing without network access
        run: node --test tests/archive-pagination.test.cjs
      - name: Test anonymous comments in SQLite without network access
        run: node --test tests/comments.test.cjs
      - name: Verify Cloudflare Worker can be packaged without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/mihassei-worker

name: One-time verify public manual X desk
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Confirm live X desk, safe article cards and noindex status
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import time
          from urllib.request import Request,urlopen
          from scripts.share_desk import select_candidates
          from scripts.build import social_image
          from scripts.media_policy import usable_cached_photo
          from pathlib import Path

          SITE="https://veripsa.com"
          data=json.loads(Path("content/articles.json").read_text(encoding="utf-8"))
          picks=select_candidates(data,3)
          def get(path):
              req=Request(SITE+path,headers={
                "User-Agent":"MihasseiXDeskHealth/1.0",
                "Cache-Control":"no-cache","Accept":"text/html,image/png,image/jpeg,*/*"})
              with urlopen(req,timeout=20) as resp:
                  if resp.status!=200:raise RuntimeError("HTTP "+str(resp.status)+" "+path)
                  return resp.read(4_000_000),resp.headers.get("Content-Type",""),resp.headers

          for attempt in range(1,23):
              try:
                  body,mime,headers=get("/share-desk/?verify="+str(attempt))
                  page=body.decode("utf-8")
                  if "text/html" not in mime:raise RuntimeError("Not HTML")
                  if 'name="robots" content="noindex,nofollow"' not in page:
                      raise RuntimeError("noindex meta missing")
                  if "noindex" not in (headers.get("X-Robots-Tag","").lower()):
                      raise RuntimeError("noindex HTTP header missing")
                  if page.count('<article class="item">')!=len(picks):
                      raise RuntimeError("Wrong number of promotion candidates")
                  for item in picks:
                      slug=item["slug"]
                      if html.escape(item["title"]) not in page:raise RuntimeError("Story absent "+slug)
                      img_url=social_image(item)
                      if html.escape(img_url,quote=True) not in page:raise RuntimeError("Image absent "+slug)
                      image,img_mime,_=get(img_url)
                      if img_url.split("?")[0].endswith(".png"):
                          if "image/png" not in img_mime or image[:8]!=bytes([137,80,78,71,13,10,26,10]):
                              raise RuntimeError("Invalid PNG for "+slug)
                      else:
                          if "image/jpeg" not in img_mime or image[:3]!=bytes([255,216,255]):
                              raise RuntimeError("Invalid JPEG for "+slug)
                  if page.count('<button type="button" data-copy-post>投稿文をコピー</button>')!=len(picks):
                      raise RuntimeError("Missing copy controls")
                  if page.count("Xで下書きを開く")!=len(picks):
                      raise RuntimeError("Missing manual X draft links")
                  rss,_,_=get("/sitemap.xml")
                  if b"/share-desk/" in rss:raise RuntimeError("Desk leaked into sitemap")
                  print("PASS: live X desk is public, noindexed, and lists",len(picks),
                        "real articles with valid on-site images and manual controls",flush=True)
                  break
              except Exception as exc:
                  print("Attempt",attempt,"failed:",str(exc),flush=True)
                  if attempt==22:raise
                  time.sleep(9)
          PY

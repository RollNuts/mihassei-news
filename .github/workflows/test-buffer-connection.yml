name: Test Buffer Connection (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Buffer authentication and linked X channel (read-only)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python social-bot/check_connection.py

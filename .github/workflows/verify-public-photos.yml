name: Verify live article delivery and SEO
on:
  push:
    branches: [main]
  workflow_dispatch:
# Each new main push supersedes the previous deployment check.
# Avoid treating a superseded commit as a production failure.
# Read-only public-byte verification is the sole deployment wait.
concurrency:
  group: verify-live-production-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the exact revision served by the public site
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/wait_for_live_revision.py
      - name: Verify the published revision and live stories without generating traffic
        run: python3 scripts/check_live.py
      - name: Verify that Twitterbot can fetch each first-party image card
        run: python3 scripts/check_share_cards.py

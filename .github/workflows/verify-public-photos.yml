name: Verify live article delivery and SEO
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
# Each public-input main push supersedes the previous deployment check.
# Docs-only pushes must not start a run that cancels that check.
# Avoid treating a superseded commit as a production failure.
# Read-only public-byte verification is the sole deployment wait.
concurrency:
  group: verify-live-production-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the public revision or a proven docs-only ancestor
        id: revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/wait_for_live_revision.py --allow-docs-only
      - name: Verify the published revision and live stories without generating traffic
        id: live
        run: python3 scripts/check_live.py
      - name: Verify that Twitterbot can fetch each first-party image card
        id: cards
        run: python3 scripts/check_share_cards.py
      - name: Report photograph completion separately from delivery checks
        id: photo_health
        if: always() && !cancelled()
        env:
          PHOTO_REVISION_CHECK: ${{ steps.revision.outcome }}
          PHOTO_ARTICLE_CHECK: ${{ steps.live.outcome }}
          PHOTO_SHARE_CARD_CHECK: ${{ steps.cards.outcome }}
        run: python3 scripts/report_photo_health.py --output "$RUNNER_TEMP/live-photo-health.json"
      - name: Keep the revision-bound photograph recovery report
        if: always() && steps.photo_health.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-photo-health-${{ github.run_id }}
          path: ${{ runner.temp }}/live-photo-health.json
          if-no-files-found: error
          retention-days: 3

  photo_completion:
    # The public-byte verifier above remains read-only. Only this isolated job
    # may record check metadata; it never writes articles, assets or deployment.
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && github.repository == 'RollNuts/mihassei-news' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: live-photo-health-${{ github.run_id }}
          path: ${{ runner.temp }}/photo-health
      - name: Validate this run's revision-bound photograph report
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DETAILS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/review_release_guard.py photo-check-payload \
            --report "$RUNNER_TEMP/photo-health/live-photo-health.json" --expected-sha "$EXPECTED_SHA" \
            --details-url "$DETAILS_URL" --output "$RUNNER_TEMP/photo-completion-check.json"
      - name: Record photograph completion separately from delivery
        uses: actions/github-script@v8
        with:
          retries: 0
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const payload = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'photo-completion-check.json'), 'utf8'));
            const expectedUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (context.repo.owner !== 'RollNuts' || context.repo.repo !== 'mihassei-news' ||
                context.ref !== 'refs/heads/main' || payload.head_sha !== context.sha ||
                payload.name !== 'Photograph completion' || payload.status !== 'completed' ||
                !['success', 'failure'].includes(payload.conclusion) || payload.details_url !== expectedUrl) {
              throw new Error('Photo check is not bound to this public-main verification run');
            }
            const {data} = await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: payload.name, head_sha: context.sha, status: payload.status,
              conclusion: payload.conclusion, details_url: expectedUrl, output: payload.output
            });
            core.info(JSON.stringify({id: data.id, name: data.name, conclusion: data.conclusion, head_sha: data.head_sha}));

name: Temporary verify X topic diversity
on:
  push:
    branches: [fix/x-topic-diversity-20261104]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run article promotion tests
        run: |
          python -m unittest discover -s social-bot/article-picks -p 'test_dispatch.py' -v
          python -m py_compile social-bot/article-picks/dispatch.py

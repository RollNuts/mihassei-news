name: Legacy X Midday Validation Only

on:
  pull_request:
    paths:
      - "social-bot/experiments/**"
      - ".github/workflows/x-midday-original.yml"
  push:
    branches: [main]
    paths:
      - "social-bot/experiments/**"
      - ".github/workflows/x-midday-original.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-retired-midday-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify retired midday logic offline
        run: |
          python -m unittest discover -s social-bot/experiments -p 'test_midday_dispatch.py' -v
          python -m py_compile social-bot/experiments/midday_dispatch.py
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("social-bot/experiments/config.json").read_text())
          if config.get("experiment_publishing_enabled") is not False:
              raise SystemExit("Legacy experiment publishing must remain disabled")
          if config.get("two_daily_midday_enabled") is not False:
              raise SystemExit("Legacy midday publishing must remain disabled")
          print("Legacy midday X sending is disabled.")
          PY

name: Verify live reader comments (free)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/comment-live-check.yml
      - src/comments.js
      - src/worker.js
      - wrangler.jsonc
      - scripts/build.py
      - assets/comments.js
      - assets/comment-activity.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live article form and read-only comments API
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          from urllib.request import Request, urlopen
          base = "https://veripsa.com"
          def get(path):
              req = Request(base + path, headers={"User-Agent": "MihasseiSiteHealth/1.0", "Cache-Control": "no-cache"})
              with urlopen(req, timeout=15) as response:
                  return response.read().decode("utf-8")
          for attempt in range(1, 19):
              try:
                  home = get("/?probe=comments-"+str(attempt))
                  match = re.search(r'href="/articles/([a-z0-9-]+)/"', home)
                  if not match: raise RuntimeError("No article link")
                  slug = match.group(1)
                  story = get("/articles/" + slug + "/?probe=comments-"+str(attempt))
                  if 'data-comments data-article="' + slug + '"' not in story:
                      raise RuntimeError("Comment form not deployed")
                  if 'id="reader-comments"' not in story or 'data-comment-count="' + slug + '"' not in story:
                      raise RuntimeError("Comment link and counter not deployed")
                  if 'data-comment-discussions' not in home:
                      raise RuntimeError("Homepage participation not deployed")
                  data = json.loads(get("/api/comments?article="+slug+"&probe="+str(attempt)))
                  if data.get("article") != slug or not isinstance(data.get("comments"), list):
                      raise RuntimeError("Comments API does not return expected JSON")
                  summary = json.loads(get("/api/comments/summary?articles="+slug+"&probe="+str(attempt)))
                  if summary.get("version") != 1 or not isinstance(summary.get("counts",{}).get(slug), int):
                      raise RuntimeError("Comments summary API not deployed")
                  print("PASS: comment UI, detail API and summary API live for", slug)
                  break
              except Exception as exc:
                  print("Attempt", attempt, ":", str(exc), flush=True)
                  if attempt == 18: raise SystemExit("Live comments are not ready / check Cloudflare deployment")
                  time.sleep(15)
          PY

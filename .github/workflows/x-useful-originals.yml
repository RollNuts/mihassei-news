name: Legacy X Originals Validation Only

on:
  push:
    branches: [main]
    paths:
      - 'social-bot/useful-posts.json'
      - 'social-bot/useful_feed.py'
      - 'social-bot/test_useful_feed.py'
      - '.github/workflows/x-useful-originals.yml'
  pull_request:
    paths:
      - 'social-bot/useful-posts.json'
      - 'social-bot/useful_feed.py'
      - 'social-bot/test_useful_feed.py'
      - '.github/workflows/x-useful-originals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-retired-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retired useful feed stays valid and disabled
        run: |
          python -m unittest discover -s social-bot -p 'test_useful_feed.py' -v
          python social-bot/useful_feed.py --validate
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path("social-bot/useful-posts.json").read_text())
          if feed.get("enabled") is not False:
              raise SystemExit("Legacy useful X lane must remain disabled")
          print("Legacy useful X auto-posting is disabled.")
          PY

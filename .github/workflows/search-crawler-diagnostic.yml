name: Search crawler accessibility diagnostic
on:
  push:
    paths:
      - .github/workflows/search-crawler-diagnostic.yml
  # A free, read-only DNS/crawler check twice a day, while Search Console settles.
  schedule:
    - cron: '43 11,23 * * *' # 20:43 and 08:43 JST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect live DNS, SSL and Google inspection access
        run: |
          set +e
          echo "===== Resolver results ====="
          for dns in 8.8.8.8 1.1.1.1; do
            echo "DNS server: $dns"
            dig +time=3 +tries=1 @"$dns" veripsa.com A +noall +answer
            dig +time=3 +tries=1 @"$dns" veripsa.com AAAA +noall +answer
            dig +time=3 +tries=1 @"$dns" veripsa.com NS +noall +answer
            echo "DNSSEC DS records (if present):"
            dig +time=3 +tries=1 @"$dns" veripsa.com DS +noall +answer
            echo "Resolver reply status (watch for SERVFAIL):"
            dig +time=3 +tries=1 @"$dns" veripsa.com A | grep -E 'status:|flags:' | head -2
          done
          echo "===== Default user-agent ====="
          for url in https://veripsa.com/ https://veripsa.com/robots.txt https://veripsa.com/sitemap.xml; do
            echo "--- $url ---"
            curl --compressed -sS -L -D /tmp/response-headers -o /tmp/response-body --connect-timeout 10 --max-time 18 \
              -w "HTTP=%{http_code} remote_ip=%{remote_ip} SSL_verify=%{ssl_verify_result} redirect=%{redirect_url} bytes=%{size_download}\n" "$url"
            grep -iE '^(HTTP/|content-type:|location:|cf-ray:|x-robots-tag:|server:)' /tmp/response-headers | head -20
            head -c 180 /tmp/response-body | tr '\n' ' '
            echo
          done
          echo "===== Claimed Google-InspectionTool UA (does not emulate Google IP) ====="
          for url in https://veripsa.com/ https://veripsa.com/robots.txt https://veripsa.com/sitemap.xml; do
            echo "--- $url ---"
            curl --compressed -sS -L -D /tmp/google-headers -o /tmp/google-body --connect-timeout 10 --max-time 18 \
              -A 'Mozilla/5.0 (compatible; Google-InspectionTool/1.0)' \
              -w "HTTP=%{http_code} remote_ip=%{remote_ip} SSL_verify=%{ssl_verify_result} redirect=%{redirect_url} bytes=%{size_download}\n" "$url"
            grep -iE '^(HTTP/|content-type:|location:|cf-ray:|x-robots-tag:|server:)' /tmp/google-headers | head -20
            head -c 180 /tmp/google-body | tr '\n' ' '
            echo
          done
          echo "===== Twitterbot card metadata and public image ====="
          curl --compressed -sS -L -D /tmp/x-headers -o /tmp/x-html -A 'Twitterbot/1.0' --connect-timeout 10 --max-time 18 \
            -w "HTML HTTP=%{http_code} bytes=%{size_download} mime=%{content_type}\n" https://veripsa.com/
          grep -iE '^(HTTP/|content-type:|cf-ray:|server:)' /tmp/x-headers | head -12
          grep -oiE '<meta[^>]+(twitter:|og:)[^>]*>' /tmp/x-html | head -24 || true
          curl --compressed -sS -L -D /tmp/x-image-headers -o /tmp/x-image -A 'Twitterbot/1.0' --connect-timeout 10 --max-time 18 \
            -w "IMAGE HTTP=%{http_code} bytes=%{size_download} mime=%{content_type}\n" https://veripsa.com/og/brand-launch-20261102-v3.png
          grep -iE '^(HTTP/|content-type:|cf-ray:|server:)' /tmp/x-image-headers | head -12
          file /tmp/x-image
          od -An -tx1 -N8 /tmp/x-image
          echo "===== Test complete; genuine Google crawler IP must be checked in Cloudflare Security Events ====="

      - name: Assert crawler metadata, robots and sitemap against live public site
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request
          import urllib.robotparser
          from xml.etree import ElementTree as ET
          
          site = "https://veripsa.com"
          def get(path, agent="Mihassei-ReadOnly-CrawlerDiagnostic/1.0"):
              req = urllib.request.Request(
                  path if path.startswith("https://") else site + path,
                  headers={"User-Agent": agent, "Accept": "text/html,image/png,image/jpeg,application/xml,*/*"})
              with urllib.request.urlopen(req, timeout=18) as res:
                  if res.status != 200:
                      raise RuntimeError(f"HTTP {res.status} for {path}")
                  return res.read(4 * 1024 * 1024), res.headers.get("Content-Type","")
          
          page, page_type = get("/", "Twitterbot/1.0")
          if "text/html" not in page_type:
              raise RuntimeError("Twitterbot did not get HTML")
          markup = page.decode("utf-8")
          def meta(name):
              found = re.search(
                  r'<meta\s+(?:property|name)="' + re.escape(name) + r'"\s+content="([^"]+)"',
                  markup, re.I)
              if not found:
                  raise RuntimeError("Missing social metadata: " + name)
              return html.unescape(found.group(1))
          
          if meta("twitter:card") != "summary_large_image":
              raise RuntimeError("X large preview is not configured")
          og = meta("og:image")
          twitter = meta("twitter:image")
          if og != twitter:
              raise RuntimeError("X and Open Graph point to different image URLs")
          image_url = urllib.parse.urlsplit(og)
          if image_url.scheme != "https" or image_url.netloc != "veripsa.com":
              raise RuntimeError("Social image is not HTTPS on this domain")
          if not image_url.path.startswith("/") or image_url.path.lower().endswith(".svg"):
              raise RuntimeError("Social image is not a supported raster path")
          image, mime = get(og, "Twitterbot/1.0")
          if "image/png" in mime:
              if not image.startswith(bytes((137,80,78,71,13,10,26,10))):
                  raise RuntimeError("X image PNG signature invalid")
          elif "image/jpeg" in mime:
              if not image.startswith(bytes((255,216,255))):
                  raise RuntimeError("X image JPEG signature invalid")
          else:
              raise RuntimeError("Unsupported social image type: " + mime)
          if len(image) < 1024:
              raise RuntimeError("X social image is too small")
          print("Verified first-party X card metadata and raster image:", og, "bytes=",len(image))
          
          robots, robots_type = get("/robots.txt")
          parser = urllib.robotparser.RobotFileParser()
          parser.parse(robots.decode("utf-8").splitlines())
          if not parser.can_fetch("Googlebot", site + "/"):
              raise RuntimeError("robots.txt forbids Googlebot on the homepage")
          if not parser.can_fetch("Twitterbot", site + "/"):
              raise RuntimeError("robots.txt forbids Twitterbot on the homepage")
          if "Sitemap: https://veripsa.com/sitemap.xml" not in robots.decode("utf-8"):
              raise RuntimeError("robots.txt has no sitemap discovery directive")
          
          sitemap,sitemap_type = get("/sitemap.xml")
          if "xml" not in sitemap_type:
              raise RuntimeError("Sitemap not served as XML")
          root=ET.fromstring(sitemap)
          ns={"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls=[n.findtext("s:loc",namespaces=ns) for n in root.findall("s:url",ns)]
          if not urls or not all(u and u.startswith(site+"/") for u in urls):
              raise RuntimeError("Sitemap URLs invalid")
          articles=[u for u in urls if "/articles/" in u]
          if len(articles)<5:
              raise RuntimeError("Sitemap has fewer than 5 indexed real article URLs; deployment may be stale")
          print("Verified Googlebot/Twitterbot robots access and sitemap article URLs:",len(articles))
          print("This cannot confirm requests from genuine Google/X crawler IP ranges.")
          PY

name: Legacy X Experiment Review Validation

on:
  pull_request:
    paths:
      - "social-bot/experiments/review.py"
      - "social-bot/experiments/test_review.py"
      - "social-bot/experiments/dispatch.py"
      - ".github/workflows/x-weekly-experiments.yml"
  push:
    branches: [main]
    paths:
      - "social-bot/experiments/review.py"
      - "social-bot/experiments/test_review.py"
      - "social-bot/experiments/dispatch.py"
      - ".github/workflows/x-weekly-experiments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-retired-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify old experiment review logic offline
        run: |
          python -m unittest discover -s social-bot/experiments -p 'test_review.py' -v
          python -m unittest discover -s social-bot/experiments -p 'test_dispatch.py' -v
          python -m py_compile social-bot/experiments/review.py social-bot/experiments/dispatch.py

name: Public PV API health
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 23 * * *' # 08:41 JST; read-only verification
  workflow_dispatch:
concurrency:
  group: public-pv-health-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the exact public revision on main pushes
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          short_sha="$(printf '%s' "$EXPECTED_SHA" | cut -c1-12)"
          endpoint="https://veripsa.com/build-revision.txt?release=$short_sha"
          latest="(not reached)"
          attempt=1
          while [ "$attempt" -le 24 ]; do
            latest="$(curl --fail --silent --show-error --max-time 9               -H 'Cache-Control: no-cache'               -H 'Pragma: no-cache'               "$endpoint" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$latest" = "$EXPECTED_SHA" ]; then
              echo "Public site confirmed serving requested commit: $EXPECTED_SHA"
              break
            fi
            echo "Public revision not updated yet: attempt $attempt expected $short_sha observed ${latest:-unavailable}"
            if [ "$attempt" -eq 24 ]; then
              echo "::error::Public site never served commit $EXPECTED_SHA"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
      - name: Verify production site, engagement and public comments APIs
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request, urllib.error
          from datetime import date, datetime, timedelta
          base = "https://veripsa.com"
          urls = [
            ("/", "html"),
            ("/ads.txt", "ads"),
            ("/api/engagement?articles=apology-before-incident", "json"),
            ("/api/comments?article=apology-before-incident", "comments"),
            ("/articles/apology-before-incident/", "poll_page"),
          ]
          for path, kind in urls:
              error = None
              for attempt in range(7):
                  try:
                      req = urllib.request.Request(base+path,headers={
                          "User-Agent":"MihasseiShimbun-HealthCheck/1.0",
                          "Accept":"application/json,text/html,*/*",
                          "Cache-Control":"no-cache",
                      })
                      with urllib.request.urlopen(req,timeout=13) as r:
                          code,body,mime = r.status,r.read(200000),r.headers.get("content-type","")
                      if code != 200: raise RuntimeError("HTTP "+str(code))
                      if kind=="ads":
                          expected=b"google.com, pub-6754575901141756, DIRECT, f08c47fec0942fa0"
                          if body.strip()!=expected:
                              raise RuntimeError("public ads.txt mismatch: "+repr(body[:100]))
                          print("VERIFIED public AdSense ads.txt ownership file")
                      elif kind=="json":
                          data = json.loads(body)
                          if data.get("unit")!="anonymous-browser" or not isinstance(data.get("visitors"),int):
                              raise RuntimeError("not a valid engagement JSON: "+repr(data)[:300])
                          details=data.get("articles",{}).get("apology-before-incident",{})
                          if not isinstance(details.get("likes"),int) or not isinstance(details.get("readers"),int):
                              raise RuntimeError("article counts are not integers")
                          votes=details.get("votes")
                          if not isinstance(votes,dict) or any(type(votes.get(k)) is not int or votes[k]<0 for k in ("plausible","unlikely")):
                              raise RuntimeError("future poll API counts are missing or invalid")
                          # Keep legacy API compatibility checks, but measure the
                          # public counters and recommendations with actual PVs.
                          today=data.get("today")
                          if (not isinstance(today,dict)
                              or not isinstance(today.get("dateJst"),str)
                              or len(today["dateJst"])!=10
                              or any(type(today.get(k)) is not int or today[k]<0
                                     for k in ("visitors","articleReads"))):
                              raise RuntimeError("daily audience fields not available")
                          if type(details.get("todayReaders")) is not int or details["todayReaders"]<0:
                              raise RuntimeError("daily article audience field missing")
                          tracking=data.get("pageViewTracking")
                          if (not isinstance(tracking,dict)
                              or tracking.get("unit")!="page-view"
                              or tracking.get("timezone")!="Asia/Tokyo"
                              or "startedAtUtc" not in tracking):
                              raise RuntimeError("PV measurement metadata missing")
                          started=tracking["startedAtUtc"]
                          if started is not None:
                              if (not isinstance(started,str)
                                  or datetime.fromisoformat(started.replace("Z","+00:00")).tzinfo is None):
                                  raise RuntimeError("PV measurement start is invalid")
                          def measured(container,key):
                              if (not isinstance(container,dict) or key not in container
                                  or (started is None and container[key] is not None)
                                  or (started is not None and (type(container[key]) is not int or container[key]<0))):
                                  raise RuntimeError("PV field missing or invalid: "+key)
                          measured(data,"pageViews")
                          measured(today,"pageViews")
                          if today.get("pageViewsCoverage")!=("in-progress" if started is not None else "unmeasured"):
                              raise RuntimeError("current PV coverage is invalid")
                          for key in ("pageViews","todayPageViews","last7DaysPageViews"):
                              measured(details,key)
                          yesterday=data.get("yesterday")
                          today_date=date.fromisoformat(today["dateJst"])
                          if (not isinstance(yesterday,dict)
                              or yesterday.get("dateJst")!=(today_date-timedelta(days=1)).isoformat()
                              or "pageViews" not in yesterday
                              or yesterday.get("pageViewsCoverage") not in ("unmeasured","partial","complete")):
                              raise RuntimeError("previous PV measurement period missing")
                          if yesterday["pageViewsCoverage"]=="unmeasured":
                              if yesterday["pageViews"] is not None:
                                  raise RuntimeError("unmeasured previous PV must remain null")
                          elif (started is None or type(yesterday["pageViews"]) is not int
                                or yesterday["pageViews"]<0):
                              raise RuntimeError("previous PV count is invalid")
                          week=data.get("last7Days")
                          measured(week,"pageViews")
                          if (week.get("startDateJst")!=(today_date-timedelta(days=6)).isoformat()
                              or week.get("endDateJst")!=today["dateJst"]
                              or type(week.get("complete")) is not bool
                              or type(week.get("measuredDays")) is not int
                              or not 0<=week["measuredDays"]<=7):
                              raise RuntimeError("seven-day PV period is invalid")
                          if started is None and (week["measuredDays"]!=0 or week["complete"]):
                              raise RuntimeError("unmeasured PV cannot claim ranking coverage")
                          if started is not None and (
                              not today["pageViews"]<=week["pageViews"]<=data["pageViews"]
                              or not details["todayPageViews"]<=details["last7DaysPageViews"]<=details["pageViews"]
                              or details["last7DaysPageViews"]>week["pageViews"]):
                              raise RuntimeError("PV totals disagree across measurement periods")
                          if data.get("version") != 2:
                              raise RuntimeError("engagement diagnostics v2 not deployed")

                          session_tracking=data.get("sessionTracking")
                          if (not isinstance(session_tracking,dict)
                              or session_tracking.get("unit")!="session"
                              or session_tracking.get("timezone")!="Asia/Tokyo"
                              or session_tracking.get("inactivityTimeoutMinutes")!=30
                              or "startedAtUtc" not in session_tracking):
                              raise RuntimeError("session measurement metadata missing")
                          session_started=session_tracking["startedAtUtc"]
                          if session_started is None:
                              if (data.get("sessions") is not None
                                  or today.get("sessions") is not None
                                  or today.get("sessionsCoverage")!="unmeasured"):
                                  raise RuntimeError("unstarted sessions must remain unmeasured")
                          else:
                              if (not isinstance(session_started,str)
                                  or datetime.fromisoformat(session_started.replace("Z","+00:00")).tzinfo is None
                                  or type(data.get("sessions")) is not int
                                  or data["sessions"]<0
                                  or type(today.get("sessions")) is not int
                                  or today["sessions"]<0
                                  or today.get("sessionsCoverage")!="in-progress"):
                                  raise RuntimeError("session counters are invalid")

                          hourly=data.get("hourly")
                          if (not isinstance(hourly,dict)
                              or hourly.get("timezone")!="Asia/Tokyo"
                              or "startedAtUtc" not in hourly
                              or not isinstance(hourly.get("today"),list)
                              or len(hourly["today"])!=24):
                              raise RuntimeError("hourly PV diagnostics missing")
                          hourly_started=hourly["startedAtUtc"]
                          if hourly_started is not None and (
                              not isinstance(hourly_started,str)
                              or datetime.fromisoformat(hourly_started.replace("Z","+00:00")).tzinfo is None):
                              raise RuntimeError("hourly PV start is invalid")
                          allowed_coverage={"unmeasured","partial","complete","in-progress","future"}
                          measured_hourly=0
                          for hour,row in enumerate(hourly["today"]):
                              expected=today["dateJst"]+"T"+str(hour).zfill(2)+":00"
                              if (not isinstance(row,dict)
                                  or row.get("hourJst")!=expected
                                  or row.get("pageViewsCoverage") not in allowed_coverage):
                                  raise RuntimeError("hourly PV bucket is invalid: "+expected)
                              value=row.get("pageViews")
                              if row["pageViewsCoverage"] in ("unmeasured","future"):
                                  if value is not None:
                                      raise RuntimeError("unmeasured hourly PV cannot be zero-filled")
                              elif type(value) is not int or value<0:
                                  raise RuntimeError("measured hourly PV is invalid")
                              else:
                                  measured_hourly+=value
                          if started is not None and measured_hourly>today["pageViews"]:
                              raise RuntimeError("hourly PV exceeds today's PV")

                          top=data.get("topArticles")
                          if not isinstance(top,dict):
                              raise RuntimeError("top article diagnostics missing")
                          for period in ("currentHour","today","last7Days"):
                              rows=top.get(period)
                              if not isinstance(rows,list) or len(rows)>10:
                                  raise RuntimeError("top article list invalid: "+period)
                              previous=None
                              seen=set()
                              for row in rows:
                                  if (not isinstance(row,dict)
                                      or not isinstance(row.get("article"),str)
                                      or not row["article"] or row["article"] in seen
                                      or type(row.get("pageViews")) is not int
                                      or row["pageViews"]<=0
                                      or (previous is not None and row["pageViews"]>previous)):
                                      raise RuntimeError("top article row invalid: "+period)
                                  seen.add(row["article"])
                                  previous=row["pageViews"]

                          source_tracking=data.get("pageViewSourceTracking")
                          source_keys=("x","search","external","unattributed")
                          if (not isinstance(source_tracking,dict)
                              or source_tracking.get("unit")!="page-view"
                              or source_tracking.get("timezone")!="Asia/Tokyo"
                              or source_tracking.get("attribution")!="session-acquisition-channel"
                              or "startedAtUtc" not in source_tracking):
                              raise RuntimeError("page-view source metadata missing")
                          source_started=source_tracking["startedAtUtc"]
                          for field in ("pageViewSourcesToday","pageViewSourcesCurrentHour"):
                              values=data.get(field)
                              if not isinstance(values,dict) or set(values)!=set(source_keys):
                                  raise RuntimeError("page-view source counters missing: "+field)
                              if source_started is None:
                                  if any(values[key] is not None for key in source_keys):
                                      raise RuntimeError("unstarted source PV must remain null")
                              elif any(type(values[key]) is not int or values[key]<0 for key in source_keys):
                                  raise RuntimeError("page-view source counter invalid: "+field)
                          if source_started is not None and (
                              not isinstance(source_started,str)
                              or datetime.fromisoformat(source_started.replace("Z","+00:00")).tzinfo is None):
                              raise RuntimeError("page-view source start is invalid")

                          kind_tracking=data.get("pageViewKindTracking")
                          kind_keys=("home","article","archive","serial","other")
                          if (not isinstance(kind_tracking,dict)
                              or kind_tracking.get("unit")!="page-view"
                              or kind_tracking.get("timezone")!="Asia/Tokyo"
                              or kind_tracking.get("categories")!=list(kind_keys)
                              or "startedAtUtc" not in kind_tracking):
                              raise RuntimeError("page-kind PV metadata missing")
                          kind_started=kind_tracking["startedAtUtc"]
                          for field in ("pageViewKindsToday","pageViewKindsCurrentHour"):
                              values=data.get(field)
                              if not isinstance(values,dict) or set(values)!=set(kind_keys):
                                  raise RuntimeError("page-kind PV counters missing: "+field)
                              if kind_started is None:
                                  if any(values[key] is not None for key in kind_keys):
                                      raise RuntimeError("unstarted page-kind PV must remain null")
                              elif any(type(values[key]) is not int or values[key]<0 for key in kind_keys):
                                  raise RuntimeError("page-kind PV counter invalid: "+field)
                          if kind_started is not None:
                              if (not isinstance(kind_started,str)
                                  or datetime.fromisoformat(kind_started.replace("Z","+00:00")).tzinfo is None):
                                  raise RuntimeError("page-kind PV start is invalid")
                              if sum(data["pageViewKindsToday"].values())>today["pageViews"]:
                                  raise RuntimeError("page-kind PV exceeds today's PV")

                          if ("pageViewSources" in data or "pageViewKinds" in data
                              or "entrances" in details or "pageViewSources" in details):
                              raise RuntimeError("retired high-write analytics fields are still exposed")
                          print("VERIFIED diagnostics v2: sessions={} / hourlyMeasured={} / topToday={} / sources={} / pageKinds={}".format(
                              data.get("sessions"),measured_hourly,top["today"][:3],
                              data.get("pageViewSourcesToday"),data.get("pageViewKindsToday")))
                          print("VERIFIED PV API: site={}, article={}, article last7Days={} PV".format(
                              data["pageViews"],details["pageViews"],details["last7DaysPageViews"]))
                          print("VERIFIED daily PV: {} / today={} / yesterday={} / last7Days={} (JST)".format(
                              today["dateJst"],today["pageViews"],yesterday["pageViews"],week["pageViews"]))
                          print("VERIFIED reactions: likes={}, votes={}/{}".format(
                              details["likes"],votes["plausible"],votes["unlikely"]))
                      elif kind=="poll_page":
                          text=body.decode("utf-8")
                          if ('data-future-poll' not in text or
                              'data-poll-choice="plausible"' not in text or
                              'data-poll-choice="unlikely"' not in text):
                              raise RuntimeError("future prediction UI not deployed")
                          print("VERIFIED public future prediction buttons on article (read-only)")
                      elif kind=="comments":
                          data = json.loads(body)
                          if data.get("article")!="apology-before-incident" or not isinstance(data.get("total"),int) or not isinstance(data.get("comments"),list):
                              raise RuntimeError("comments API JSON shape invalid: "+repr(data)[:250])
                          if data["total"] < 0 or len(data["comments"]) > 20:
                              raise RuntimeError("invalid public comment totals")
                          print("VERIFIED public comments API: {} visible posts in this article (read-only)".format(data["total"]))
                      elif b"mihassei-news" not in body and "未発生新聞".encode() not in body:
                          raise RuntimeError("homepage did not return the newspaper")
                      else:
                          print("VERIFIED newspaper home: HTTP 200")
                      break
                  except Exception as exc:
                      error=exc
                      print("Attempt {} for {} failed: {}".format(attempt+1,path,str(exc)[:250]))
                      time.sleep(5)
              else:
                  sys.exit("Public production health check failed for {}: {}".format(path,error))
          PY

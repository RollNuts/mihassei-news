name: X Delivery Audit (Free, read only)

on:
  pull_request:
    paths:
      - "social-bot/article-picks/audit_delivery.py"
      - "social-bot/article-picks/test_audit_delivery.py"
      - "social-bot/article-picks/state.json"
      - ".github/workflows/x-delivery-audit.yml"
  push:
    branches: [main]
    paths:
      - "content/articles.json"
      - "social-bot/article-picks/audit_delivery.py"
      - "social-bot/article-picks/test_audit_delivery.py"
      - ".github/workflows/x-delivery-audit.yml"
  workflow_dispatch:
  schedule:
    # 23:45 JST (14:45 UTC). One bounded read-only audit after daily article promotion.
    - cron: "45 14 * * *"

permissions:
  contents: write

concurrency:
  group: x-article-delivery-audit
  cancel-in-progress: false

jobs:
  audit-delivery:
    if: github.repository == 'RollNuts/mihassei-news'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify article delivery audit offline
        run: |
          python -m unittest discover -s social-bot/article-picks -p 'test_audit_delivery.py' -v
          python -m py_compile social-bot/article-picks/audit_delivery.py

      - name: Audit recent article promotions in Buffer (read-only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          X_AUDIT_TRIGGER_EVENT: ${{ github.event_name }}
        run: python social-bot/article-picks/audit_delivery.py

      - name: Persist article delivery evidence only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          test -f social-bot/article-picks/delivery.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/article-picks/delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): store article delivery evidence [skip ci]"
            published=false
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then
                published=true
                break
              fi
              sleep $((attempt * 2))
            done
            test "$published" = true
          fi

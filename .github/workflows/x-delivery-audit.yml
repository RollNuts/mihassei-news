name: X Original Delivery Audit (Free, read only)

on:
  pull_request:
    paths:
      - "social-bot/experiments/probe_delivery.py"
      - "social-bot/experiments/test_probe_delivery.py"
      - ".github/workflows/x-delivery-audit.yml"
  push:
    branches: [main]
    paths:
      # A workflow code change is a one-off diagnostic trigger.
      # Regular article/post updates do not trigger additional Buffer API reads.
      - ".github/workflows/x-delivery-audit.yml"
  workflow_dispatch:
  schedule:
    # 23:45 JST (14:45 UTC). One bounded audit after most daily X slots.
    - cron: "45 14 * * *"

permissions:
  contents: write

concurrency:
  # Read-only auditing must not be evicted by a parallel X queue refill.
  # It writes delivery.json only; the publishing workflow writes state.json.
  group: free-surreal-x-delivery-audit
  cancel-in-progress: false

jobs:
  audit-delivery:
    if: github.repository == 'RollNuts/mihassei-news'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded read-only logic without X access
        run: |
          python -m unittest discover -s social-bot/experiments -p 'test_probe_delivery.py' -v
          python -m py_compile social-bot/experiments/probe_delivery.py

      - name: Audit up to 20 Buffer posts in two aliased GraphQL requests (read-only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python social-bot/experiments/probe_delivery.py

      - name: Persist delivery evidence only, not X posts or original ledger
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/experiments/delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): store bounded delivery evidence [skip ci]"
            # Multiple independent Actions write main; a transient ref race is
            # not an editorial or Buffer failure. Rebase and retry, never force.
            published=false
            for attempt in 1 2 3 4; do
              if ! git pull --rebase origin main; then
                echo "::error::Rebase conflict. No forced push or silent overwrite."
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "::warning::main advanced during push (attempt $attempt); retry safely"
              sleep $((attempt * 2))
            done
            if [ "$published" != true ]; then
              echo "::error::Could not persist evidence after four attempts"
              exit 1
            fi
          fi

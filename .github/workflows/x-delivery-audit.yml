name: X Delivery Audit (Free, read only)

on:
  pull_request:
    paths:
      - "social-bot/article-picks/audit_delivery.py"
      - "social-bot/article-picks/test_audit_delivery.py"
      - "social-bot/article-picks/state.json"
      - "social-bot/article-picks/test_buffer_budget.py"
      - "social-bot/buffer_budget.py"
      - ".github/workflows/x-delivery-audit.yml"
  push:
    branches: [main]
    paths:
      - "content/articles.json"
      - "social-bot/article-picks/audit_delivery.py"
      - "social-bot/article-picks/test_audit_delivery.py"
      - ".github/workflows/x-delivery-audit.yml"
  workflow_dispatch:
  # Fallback when GitHub skips/delays scheduled :35 checks: audit only after
  # the article publisher has completed its own receipt-persistence step.
  workflow_run:
    workflows: ["X Article Promotion (Buffer Free)"]
    types: [completed]
  schedule:
    # Read-only checks 30 minutes after each article slot, plus one final 23:45 JST audit.
    - cron: "35 0,2,4,6,8,10,12 * * *"
    - cron: "45 14 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('x-audit-validation-{0}', github.ref) || 'x-article-promotion' }}
  cancel-in-progress: false

jobs:
  audit-delivery:
    # workflow_run can access write credentials: never run a PR/fork workflow's
    # code or allow a non-main publisher event to trigger provider reads.
    if: >-
      github.repository == 'RollNuts/mihassei-news' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event) &&
        contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify article delivery audit offline
        run: |
          python -m unittest discover -s social-bot/article-picks -p 'test_audit_delivery.py' -v
          python -m unittest discover -s social-bot/article-picks -p 'test_buffer_budget.py' -v
          python -m py_compile social-bot/article-picks/audit_delivery.py

      - name: Audit recent article promotions in Buffer (read-only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          X_AUDIT_TRIGGER_EVENT: ${{ github.event_name }}
          BUFFER_BUDGET_PATH: social-bot/article-picks/api-budget.json
          BUFFER_REQUEST_ROLE: audit
        run: python social-bot/article-picks/audit_delivery.py

      - name: Persist article delivery evidence only
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          test -f social-bot/article-picks/delivery.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/article-picks/delivery.json social-bot/article-picks/api-budget.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): store article delivery evidence [skip ci]"
            published=false
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then
                published=true
                break
              fi
              sleep $((attempt * 2))
            done
            test "$published" = true
          fi

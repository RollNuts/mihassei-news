name: Purge Retired X Experiment Posts

on:
  push:
    branches: [main]
    paths:
      - "social-bot/purge_retired_x.py"
      - "social-bot/experiments/config.json"
      - ".github/workflows/purge-retired-x.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purge-retired-x
  cancel-in-progress: false

jobs:
  validate-and-purge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate retired experiment boundary
        run: |
          python social-bot/purge_retired_x.py
          python -m py_compile social-bot/purge_retired_x.py

      - name: Delete only exact unsent retired experiment Buffer posts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          python social-bot/purge_retired_x.py --apply
          purge_code=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/purge-retired-x-result.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): record retired Buffer purge result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          exit "$purge_code"

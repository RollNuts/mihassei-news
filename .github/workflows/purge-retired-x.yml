name: Inspect / Purge Retired X Experiment Posts

on:
  # Push validates local history only; Buffer access requires a manual main run.
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-retired-x.yml"
      - "social-bot/purge_retired_x.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = read-only ID/status check; apply = delete exact unsent legacy matches"
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - apply

permissions:
  contents: write

concurrency:
  group: purge-retired-x
  cancel-in-progress: false

jobs:
  validate-and-purge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate retired experiment boundary
        run: |
          python social-bot/purge_retired_x.py
          python -m unittest discover -s tests -p 'test_purge_retired_x.py' -v
          python -m py_compile social-bot/purge_retired_x.py

      - name: Inspect or clean exact legacy matches only by manual request
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PURGE_MODE: ${{ inputs.mode }}
        run: |
          case "$PURGE_MODE" in
            inspect) purge_arg="--inspect" ;;
            apply) purge_arg="--apply" ;;
            *) echo "Invalid cleanup mode"; exit 2 ;;
          esac

          set +e
          python social-bot/purge_retired_x.py "$purge_arg"
          purge_code=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/purge-retired-x-result.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): record retired Buffer purge result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          exit "$purge_code"

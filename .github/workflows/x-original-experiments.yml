name: X Impressions Original Text Experiments (Buffer Free)

on:
  push:
    branches: [main]
    paths:
      - "social-bot/experiments/posts.json"
      - "social-bot/experiments/config.json"
      - "social-bot/experiments/dispatch.py"
      - "social-bot/experiments/visuals.py"
      - "social-bot/experiments/test_visuals.py"
      - "social-bot/experiments/probe_delivery.py"
      - "social-bot/experiments/test_probe_delivery.py"
      - "social-bot/publish.py"
      - "social-bot/experiments/test_dispatch.py"
      - "social-bot/article-picks/**"
      - ".github/workflows/x-original-experiments.yml"
  pull_request:
    paths:
      - "social-bot/experiments/**"
      - "social-bot/article-picks/**"
      - ".github/workflows/x-original-experiments.yml"
  workflow_dispatch:
  schedule:
    # Buffer owns all seven daily publishing slots; refill only at 00:05
    # and 12:05 JST (UTC 15:05 and 03:05) to respect the Free API budget.
    - cron: "5 3,15 * * *"

permissions:
  contents: write

concurrency:
  group: free-surreal-x
  cancel-in-progress: false

jobs:
  validate-and-refill:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install free local illustration renderer (no AI API)
        run: python -m pip install --disable-pip-version-check "Pillow==12.0.0"

      - name: Render original X illustrations without revising old assets
        run: python social-bot/experiments/visuals.py

      - name: Check visual content, dimensions and image mutation safety
        run: python -m unittest discover -s social-bot/experiments -p 'test_visuals.py' -v

      - name: Validate original X ideas, caps, no duplicates or cross-account sending
        run: |
          python -m unittest discover -s social-bot/experiments -p 'test_dispatch.py' -v
          python -m unittest discover -s social-bot/experiments -p 'test_probe_delivery.py' -v
          python -m py_compile social-bot/experiments/dispatch.py social-bot/experiments/probe_delivery.py

      - name: Validate promotion dedupe, measured interest, creative-lane fairness
        run: |
          python -m unittest discover -s social-bot/article-picks -p 'test_dispatch.py' -v
          python -m py_compile social-bot/article-picks/dispatch.py

      # Asset URLs must exist at main BEFORE the Buffer image mutation.
      # PR validation renders locally but never pushes or calls Buffer.
      - name: Host newly generated experiment PNGs on main before queueing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/assets/xexp-*.png
          if ! git diff --cached --quiet; then
            git commit -m "media(x): add original zero-cost X scene illustrations [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Refill seven daily original X Buffer slots safely
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python social-bot/experiments/dispatch.py

      - name: Fill any remaining free Buffer slot with a measured-interest article
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python social-bot/article-picks/dispatch.py

      - name: Record exact Buffer submission IDs (also after partial API failure)
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/experiments/state.json social-bot/article-picks/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): persist verified Buffer experiment IDs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

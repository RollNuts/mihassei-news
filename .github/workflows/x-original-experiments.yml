name: X Article Promotion (Buffer Free)

on:
  push:
    branches: [main]
    # Posting fallback only wakes for article archive changes.
    # Validation of code edits remains on pull_request and the shared CI.
    paths:
      - "content/articles.json"
  pull_request:
    paths:
      - "social-bot/article-picks/**"
      - "social-bot/publish.py"
      - "social-bot/social_text.py"
      - ".github/workflows/x-original-experiments.yml"
  workflow_dispatch:
  schedule:
    # Seven JST checks: 09:05, 11:05, 13:05, 15:05, 17:05, 19:05, 21:05.
    - cron: "5 0,2,4,6,8,10,12 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('x-article-validation-{0}', github.ref) || 'x-article-promotion' }}
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate article promotion, dedupe and safety gates
        run: |
          python -m unittest discover -s social-bot/article-picks -p 'test_dispatch.py' -v
          python -m py_compile social-bot/article-picks/dispatch.py

      - name: Send at most one eligible Veripsa article now
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          X_TRIGGER_EVENT: ${{ github.event_name }}
          X_PUSH_BEFORE: ${{ github.event.before }}
        run: python social-bot/article-picks/dispatch.py

      - name: Persist exact Buffer article receipt
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/article-picks/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(x): persist article promotion receipt [skip ci]"
            published=false
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then
                published=true
                break
              fi
              sleep $((attempt * 2))
            done
            test "$published" = true
          fi

name: Free CPU staged-news photos (public repository only)
run-name: "${{ inputs.backfill_scene && format('Photo backfill: {0}', inputs.slug) || 'Free CPU staged-news photos' }}"

on:
  # Image-only pushes do not match, so publication cannot recurse.
  push:
    branches: [main]
    paths: ['content/articles.json', '.github/workflows/free-cpu-scenes.yml']
  # Catch missed token-origin pushes and a backlog while the Mac is asleep.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      preview_model:
        description: 'Default image route, or one source-bound SDXL portrait preview only'
        type: choice
        options: ['default', 'sdxl']
        default: 'default'
      limit:
        description: 'Number of missing story images (max 3)'
        type: choice
        options: ['1', '2', '3']
        default: '3'
      slug:
        description: 'Optional exact article slug'
        type: string
        default: ''
      retry_held:
        description: 'Retry one held image for visual review only (requires exact slug)'
        type: boolean
        default: false
      publish:
        description: 'Publish verified new JPEGs; leave OFF for visual review'
        type: boolean
        default: false
      backfill_scene:
        description: 'One review-only scene for an illustration/held story; requires slug, retry_held, limit=1, publish=OFF'
        type: string
        default: ''
      backfill_reference:
        description: 'Use the original reviewed SVG as a guide for this manual backfill preview only'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: first-party-cpu-scenes
  cancel-in-progress: false

jobs:
  render:
    # Standard CPU runners are free on a public GitHub repository. Never bill
    # a private fork or execute image generation from an untrusted pull request.
    if: github.repository == 'RollNuts/mihassei-news' && github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.preview_model == '' || inputs.preview_model == 'default')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      VERIPSA_ENABLE_FREE_CPU: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      SCENE_LIMIT: ${{ inputs.limit || '3' }}
      SCENE_SLUG: ${{ inputs.slug || '' }}
      RETRY_HELD: ${{ inputs.retry_held && '1' || '0' }}
      BACKFILL_SCENE: ${{ inputs.backfill_scene || '' }}
      BACKFILL_REFERENCE: ${{ inputs.backfill_reference && '1' || '0' }}
      SCENE_PUBLISH: ${{ inputs.publish && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan missing images without downloading any runtime or model
        id: plan
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.github_cpu_scenes import load_articles, select_articles, cpu_prompt
          selected = select_articles(load_articles(), slug=os.environ['SCENE_SLUG'],
                                    limit=int(os.environ['SCENE_LIMIT']),
                                    retry_held=os.environ['RETRY_HELD'] == '1',
                                    backfill_scene=os.environ['BACKFILL_SCENE'],
                                    backfill_reference=os.environ['BACKFILL_REFERENCE'] == '1',
                                    review_dir=Path(os.environ['RUNNER_TEMP']) / 'cpu-scenes-review')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'pending={len(selected)}\n')
          for article in selected:
              print(json.dumps({'slug': article['slug'], 'prompt': cpu_prompt(article)}, ensure_ascii=False))
          print('Pending:', len(selected))
          PY
          df -h .
      - name: Bound daily photo backfill attempts without repeating a story
        id: backfill_quota
        if: inputs.backfill_scene != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/RollNuts/mihassei-news/actions/workflows/free-cpu-scenes.yml/runs?per_page=100' > "$RUNNER_TEMP/backfill-runs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.github_cpu_scenes import MAX_DAILY_BACKFILLS, backfill_run_allowed
          runs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'backfill-runs.json').read_text())
          allowed = backfill_run_allowed(runs['workflow_runs'], int(os.environ['GITHUB_RUN_ID']),
                                         current_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'allowed={int(allowed)}\n')
          print(f'Backfill allowed within {MAX_DAILY_BACKFILLS} daily attempts, one per story.' if allowed else
                'Backfill skipped: daily attempt budget or same-story limit reached; new articles remain independent.')
          PY
      - name: Summarize reader-visible image coverage
        env:
          IMAGE_HEALTH: ${{ runner.temp }}/image-health.json
        run: |
          python3 scripts/visual_review.py > "$IMAGE_HEALTH"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          report = json.loads(Path(os.environ["IMAGE_HEALTH"]).read_text(encoding="utf-8"))
          counts = report["counts"]
          publication = report["publication_counts"]
          strategies = report["strategy_counts"]
          attention = report["attention"]
          pending_review = counts.get("pending", 0)
          rejected = counts.get("rejected", 0)
          generic = publication.get("generic_fallback", 0)
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("### Article image health\n\n")
              out.write(f"- Accepted generated JPEG: {publication.get('generated_jpeg', 0)}\n")
              out.write(f"- Reviewed editorial SVG: {publication.get('editorial_svg', 0)}\n")
              out.write(f"- Approved cached photo: {publication.get('stock_photo', 0)}\n")
              out.write(f"- Generic SVG fallback: {generic}\n")
              out.write(f"- Illustration-routed stories: {strategies.get('illustration', 0)}\n")
              out.write(f"- CPU-photo stories: {strategies.get('cpu-photo', 0)}\n")
              out.write(f"- JPEG awaiting visual review: {pending_review}\n")
              out.write(f"- JPEG held/rejected: {rejected}\n")
              out.write("\nA green CPU job may be intentionally idle; reader-visible coverage is reported separately from generation work.\n")
              if attention:
                  out.write("\n#### Image attention queue\n")
                  for item in attention[:12]:
                      out.write(f"- `{item['slug']}`: {item['reason']}\n")
              illustration_missing = sum(
                  item.get("reason") == "illustration_strategy_without_reviewed_scene"
                  for item in attention
              )
              if generic:
                  if illustration_missing:
                      out.write(f"\n**Attention:** {illustration_missing} illustration-routed story/stories still use a generic fallback; prepare a reviewed story-specific illustration instead of CPU retry.\n")
                  else:
                      out.write("\n**Attention:** generic fallbacks remain. Keep publishing safely, but route these through image recovery instead of treating idle generation as completed image work.\n")
              elif pending_review:
                  out.write("\n**Attention:** generated JPEGs exist but are not reader-visible until visual review is recorded.\n")
              else:
                  out.write("\nNo reader-visible image coverage gap is reported by the current build-selection rules.\n")
          PY
      - name: Verify offline image gates before downloading model runtime
        if: steps.plan.outputs.pending != '0' && (!inputs.backfill_scene || steps.backfill_quota.outputs.allowed == '1')
        run: |
          python3 -m pip install --no-cache-dir Pillow==11.1.0
          if [ "$BACKFILL_REFERENCE" = 1 ]; then
            if ! dpkg -s libcairo2 >/dev/null 2>&1; then
              sudo apt-get install --no-install-recommends -y libcairo2
            fi
            python3 -m pip install --no-cache-dir CairoSVG==2.7.1
          fi
          python3 -m unittest discover -s tests -p 'test_generated_photos.py' -v
          python3 -m unittest discover -s tests -p 'test_cpu_*.py' -q
      - name: Install CPU-only open-source local model runtime (no cache)
        if: steps.plan.outputs.pending != '0' && (!inputs.backfill_scene || steps.backfill_quota.outputs.allowed == '1')
        run: |
          python3 -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python3 -m pip install --no-cache-dir \
            diffusers==0.31.0 transformers==4.46.3 huggingface_hub==0.26.5 \
            accelerate==1.2.1 safetensors==0.4.5 numpy==1.26.4
          df -h .
      - name: Generate at most three fictional JPEGs and stage only new successes
        if: steps.plan.outputs.pending != '0' && (!inputs.backfill_scene || steps.backfill_quota.outputs.allowed == '1')
        env:
          BACKFILL_QUOTA_ALLOWED: ${{ steps.backfill_quota.outputs.allowed || '0' }}
        run: |
          args=(--limit "$SCENE_LIMIT" --review-dir "$RUNNER_TEMP/cpu-scenes-review")
          if [ -n "$SCENE_SLUG" ]; then args+=(--slug "$SCENE_SLUG"); fi
          if [ "$RETRY_HELD" = 1 ]; then args+=(--retry-held); fi
          if [ -n "$BACKFILL_SCENE" ]; then args+=(--backfill-scene "$BACKFILL_SCENE"); fi
          if [ "$BACKFILL_REFERENCE" = 1 ]; then args+=(--backfill-reference); fi
          python3 scripts/github_cpu_scenes.py "${args[@]}"
          python3 scripts/publish_cpu_scenes.py --source "$RUNNER_TEMP/cpu-scenes-review"
          python3 scripts/build.py
      - name: Publish only matching images against latest main
        if: steps.plan.outputs.pending != '0' && (github.event_name != 'workflow_dispatch' || inputs.publish) && !inputs.retry_held && !inputs.backfill_scene && !inputs.backfill_reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_cpu_scenes.py --source "$RUNNER_TEMP/cpu-scenes-review" --publish
          # GitHub-token pushes do not trigger ordinary push workflows.
          gh workflow run verify-public-photos.yml --ref main
      - name: Continue selected videos after a successful public image pass
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) && !inputs.retry_held && !inputs.backfill_scene && !inputs.backfill_reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Explicit dispatch also works after a GITHUB_TOKEN image push.
          # Image and video backlogs are independent: recover ready videos even
          # with zero missing JPEGs, but do not launch another idle workflow.
          plan="$(python3 scripts/publish_motion_clips.py --plan)"
          printf '%s\n' "$plan"
          pending="$(MOTION_PLAN_JSON="$plan" python3 - <<'PY'
          import json, os
          plan = json.loads(os.environ["MOTION_PLAN_JSON"])
          if (type(plan.get("enabled")) is not bool
                  or type(plan.get("pending")) is not int or plan["pending"] < 0
                  or (not plan["enabled"] and plan["pending"] != 0)):
              raise SystemExit("Invalid video plan; no workflow dispatched")
          print(plan["pending"])
          PY
          )"
          if (( pending > 0 )); then
            gh workflow run auto-motion-clips.yml --ref main
          else
            echo "No ready video work; preserve OFF, current and editorial waiting states."
          fi
      - name: Keep only small new JPEGs for visual review or failed-push recovery
        if: always() && steps.plan.outputs.pending != '0' && (!inputs.backfill_scene || steps.backfill_quota.outputs.allowed == '1')
        uses: actions/upload-artifact@v4
        with:
          name: cpu-scenes-review-${{ github.run_id }}
          path: ${{ runner.temp }}/cpu-scenes-review/
          if-no-files-found: ignore
          retention-days: 1

  sdxl-preview:
    if: github.repository == 'RollNuts/mihassei-news' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/sdxl-preview-20261114') && inputs.preview_model == 'sdxl' && inputs.slug == 'indoor-beach-friends-exchange-ripples' && inputs.limit == '1' && inputs.retry_held && !inputs.publish && inputs.backfill_scene == '' && !inputs.backfill_reference
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SDXL_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
      VERIPSA_ENABLE_FREE_CPU: '1'
      PREVIEW_MODEL: ${{ inputs.preview_model }}
      SCENE_SLUG: ${{ inputs.slug }}
      SCENE_LIMIT: ${{ inputs.limit }}
      RETRY_HELD: ${{ inputs.retry_held && '1' || '0' }}
      SCENE_PUBLISH: ${{ inputs.publish && '1' || '0' }}
      BACKFILL_SCENE: ${{ inputs.backfill_scene || '' }}
      BACKFILL_REFERENCE: ${{ inputs.backfill_reference && '1' || '0' }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the exact source and reserve memory/disk before installing models
        run: python3 scripts/sdxl_scene_preview.py --check --output "$RUNNER_TEMP/sdxl-scene-preview"
      - name: Install the existing pinned CPU-only runtime for this preview
        run: |
          python3 -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python3 -m pip install --no-cache-dir Pillow==11.1.0 \
            diffusers==0.31.0 transformers==4.46.3 huggingface_hub==0.26.5 \
            accelerate==1.2.1 safetensors==0.4.5 numpy==1.26.4
      - name: Run one monitored SDXL preview without publication
        run: python3 scripts/sdxl_scene_preview.py --run --output "$RUNNER_TEMP/sdxl-scene-preview"
      - name: Record runtime preparation failures without loading any model
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.sdxl_scene_preview import atomic_json
          path = Path(os.environ['RUNNER_TEMP']) / 'sdxl-scene-preview/receipt.json'
          if path.is_file():
              receipt = json.loads(path.read_text())
              if receipt.get('status') == 'ready_unexecuted':
                  receipt.update(status='failed', failure_type='WorkflowPreparationFailure')
                  atomic_json(path, receipt)
          PY
      - name: Keep only the SDXL candidate JPEG, article and receipt for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdxl-scene-preview-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sdxl-scene-preview/indoor-beach-friends-exchange-ripples.jpg
            ${{ runner.temp }}/sdxl-scene-preview/articles.json
            ${{ runner.temp }}/sdxl-scene-preview/receipt.json

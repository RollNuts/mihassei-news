name: Free CPU staged-news photos (public repository only)

on:
  # Image-only pushes do not match, so publication cannot recurse.
  push:
    branches: [main]
    paths: ['content/articles.json', '.github/workflows/free-cpu-scenes.yml']
  # Catch missed token-origin pushes and a backlog while the Mac is asleep.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of missing story images (max 3)'
        type: choice
        options: ['1', '2', '3']
        default: '3'
      slug:
        description: 'Optional exact article slug'
        type: string
        default: ''
      retry_held:
        description: 'Retry one held image for visual review only (requires exact slug)'
        type: boolean
        default: false
      publish:
        description: 'Publish verified new JPEGs; leave OFF for visual review'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: first-party-cpu-scenes
  cancel-in-progress: false

jobs:
  render:
    # Standard CPU runners are free on a public GitHub repository. Never bill
    # a private fork or execute image generation from an untrusted pull request.
    if: github.repository == 'RollNuts/mihassei-news' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      VERIPSA_ENABLE_FREE_CPU: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      SCENE_LIMIT: ${{ inputs.limit || '3' }}
      SCENE_SLUG: ${{ inputs.slug || '' }}
      RETRY_HELD: ${{ inputs.retry_held && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan missing images without downloading any runtime or model
        id: plan
        run: |
          python3 - <<'PY'
          import json, os
          from scripts.github_cpu_scenes import load_articles, select_articles, cpu_prompt
          selected = select_articles(load_articles(), slug=os.environ['SCENE_SLUG'],
                                    limit=int(os.environ['SCENE_LIMIT']),
                                    retry_held=os.environ['RETRY_HELD'] == '1')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'pending={len(selected)}\n')
          for article in selected:
              print(json.dumps({'slug': article['slug'], 'prompt': cpu_prompt(article)}, ensure_ascii=False))
          print('Pending:', len(selected))
          PY
          df -h .
      - name: Install CPU-only open-source local model runtime (no cache)
        if: steps.plan.outputs.pending != '0'
        run: |
          python3 -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python3 -m pip install --no-cache-dir \
            diffusers==0.31.0 transformers==4.46.3 huggingface_hub==0.26.5 \
            accelerate==1.2.1 safetensors==0.4.5 Pillow==11.1.0 numpy==1.26.4
          df -h .
      - name: Generate at most three fictional JPEGs and stage only new successes
        if: steps.plan.outputs.pending != '0'
        run: |
          args=(--limit "$SCENE_LIMIT" --review-dir "$RUNNER_TEMP/cpu-scenes-review")
          if [ -n "$SCENE_SLUG" ]; then args+=(--slug "$SCENE_SLUG"); fi
          if [ "$RETRY_HELD" = 1 ]; then args+=(--retry-held); fi
          python3 scripts/github_cpu_scenes.py "${args[@]}"
          python3 scripts/publish_cpu_scenes.py --source "$RUNNER_TEMP/cpu-scenes-review"
          python3 -m unittest discover -s tests -p 'test_generated_photos.py' -v
          python3 -m unittest discover -s tests -p 'test_cpu_*.py' -q
          python3 scripts/build.py
      - name: Publish only matching images against latest main
        if: steps.plan.outputs.pending != '0' && (github.event_name != 'workflow_dispatch' || inputs.publish) && !inputs.retry_held
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_cpu_scenes.py --source "$RUNNER_TEMP/cpu-scenes-review" --publish
          # GitHub-token pushes do not trigger ordinary push workflows.
          gh workflow run verify-public-photos.yml --ref main
      - name: Continue selected videos after a successful public image pass
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) && !inputs.retry_held
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Explicit dispatch also works after a GITHUB_TOKEN image push.
          # The existing hourly image pass recovers remaining videos even when
          # no image is missing. The video workflow checks OFF/no work first.
          gh workflow run auto-motion-clips.yml --ref main
      - name: Keep only small new JPEGs for visual review or failed-push recovery
        if: always() && steps.plan.outputs.pending != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-scenes-review-${{ github.run_id }}
          path: ${{ runner.temp }}/cpu-scenes-review/
          if-no-files-found: ignore
          retention-days: 1

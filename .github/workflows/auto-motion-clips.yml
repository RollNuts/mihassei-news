name: Free bounded article motion clips
on:
  pull_request:
    paths:
      - '.github/workflows/auto-motion-clips.yml'
      - '.github/workflows/free-cpu-scenes.yml'
      - '.github/motion-clips.json'
      - 'scripts/motion_clips.py'
      - 'scripts/publish_motion_clips.py'
      - 'scripts/broadcast_captions.py'
      - 'scripts/visual_review.py'
      - 'scripts/news_caster_preview.py'
      - 'scripts/compose_caster_preview.py'
      - 'assets/casters/**'
      - 'tests/test_broadcast_captions.py'
      - 'tests/test_news_caster_preview.py'
      - 'tests/test_compose_caster_preview.py'
      - 'tests/test_motion_clips.py'
      - 'tests/test_motion_publisher.py'
      - 'tests/test_motion_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-motion-clips.yml'
      - '.github/motion-clips.json'
      - 'scripts/motion_clips.py'
      - 'scripts/publish_motion_clips.py'
      - 'scripts/broadcast_captions.py'
      - 'scripts/visual_review.py'
      - 'content/articles.json'
      - 'content/visual_reviews.json'
      - 'content/broadcasts.json'
      - 'assets/generated/*.jpg'
      - 'assets/generated/manifest.json'
  # Recover ready clips after missed bot-triggered events; encoding remains gated.
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      caster_preview:
        description: 'Render one CPU caster preview artifact without publishing'
        type: boolean
        default: false
      caster_source_run:
        description: 'Reuse a successful caster preview run; empty renders a new preview'
        type: string
        default: ''
      caster_source_manifest:
        description: 'Re-edit retained pilot: commit:review-manifest-path:manifest-sha256 (source run must be empty)'
        type: string
        default: ''
permissions:
  contents: read
# Parallel article/photo pushes cannot publish clips in parallel.
concurrency:
  group: free-motion-clips-v2-${{ github.ref }}
  # PR head updates supersede their own validation run. Main/scheduled publication
  # stays serialized so a newer push never interrupts a clip write in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    if: github.repository == 'RollNuts/mihassei-news' && github.event.repository.private == false && !(github.event_name == 'workflow_dispatch' && inputs.caster_preview)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'refs/heads/main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check selected video backlog before installing any encoder
        id: plan
        run: |
          python3 scripts/publish_motion_clips.py --plan
          pending="$(python3 scripts/publish_motion_clips.py --pending)"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "Selected clips waiting for generation: $pending"
      - name: Report newsroom freshness even when the encoder has no work
        run: |
          python3 scripts/publish_motion_clips.py --health > /tmp/newsroom-health.json
          cat /tmp/newsroom-health.json
          python3 - <<'PY'
          import json, os
          health = json.load(open("/tmp/newsroom-health.json", encoding="utf-8"))
          status = health["status"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Newsroom freshness (read-only)\n\n"
                            "Status: \u0060" + status + "\u0060\n\n"
                            "Newest on-air article: " + str(health.get("latest_video_article_published_at")) + "\n\n"
                            "Selected awaiting video: " + str(health.get("selected_pending", 0)) + "\n\n")
          if status in ("selection_needed", "awaiting_reviewed_source"):
              print("::warning title=Newsroom stale::On-air articles are stale; editorial selection or reviewed source required. See newsroom health summary.")
          PY
      - name: Install only free system FFmpeg on the disposable runner
        if: github.event_name == 'pull_request'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          ffmpeg -hide_banner -version | head -n 1
      - name: Test real multi-shot encoding, legacy clips, source hashes, and OFF switch
        if: github.event_name == 'pull_request'
        run: python3 -m unittest -v tests.test_motion_clips tests.test_motion_publisher tests.test_motion_workflow tests.test_broadcast_captions
      - name: Test caster preview guards offline without downloading models
        if: github.event_name == 'pull_request'
        env:
          NEWS_CASTER_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
        run: python3 -m unittest -v tests.test_news_caster_preview tests.test_compose_caster_preview

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.outputs.pending != '0' && !(github.event_name == 'workflow_dispatch' && inputs.caster_preview)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck selected video backlog before installing anything
        id: gate
        run: |
          pending="$(python3 scripts/publish_motion_clips.py --pending)"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - name: Prepare free local video encoding and static checks
        if: steps.gate.outputs.pending != '0'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          python3 -m pip install --no-cache-dir 'Pillow>=10.1,<13'
      - name: Publish at most one verified clip with normal non-force push
        if: steps.gate.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "Clip publish attempt $attempt of 3"
            git fetch --quiet origin main
            # Disposable GitHub runner only; never reset a user's Mac checkout.
            git checkout -B motion-clip-work origin/main
            if [[ "$(python3 scripts/publish_motion_clips.py --status)" != "true" ]]; then
              echo "Clip generation turned OFF in the latest main; stopped safely."
              exit 0
            fi
            python3 scripts/publish_motion_clips.py --generate
            git add -A -- assets/clips
            if git diff --cached --quiet; then
              echo "No eligible approved stills or clip budget reached; no commit."
              exit 0
            fi
            # The stage must contain ONLY pre-vetted movie bytes and its manifest.
            unexpected="$(git diff --cached --name-only | grep -Ev '^assets/clips/(manifest\.json|[a-z0-9]+(-[a-z0-9]+)*\.mp4)$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected staged file; refusing to publish: $unexpected" >&2
              exit 1
            fi
            git diff --cached --check
            python3 scripts/build.py
            python3 scripts/audit_search_index.py
            python3 -m unittest discover -s tests -q
            git commit -m "media: publish one verified multi-shot article clip"
            if git push origin HEAD:main; then
              echo "Clip-only commit pushed safely. Dispatching exact public release verification."
              # GitHub-token pushes do not launch ordinary push workflows.
              # workflow_dispatch explicitly DOES launch the existing verifier.
              gh workflow run verify-public-photos.yml --ref main
              exit 0
            fi
            echo "Main advanced; re-read all approved image + clip hashes and retry."
            sleep 3
          done
          echo "Main kept changing; no force push or silent overwrite." >&2
          exit 1

  news-caster-preview:
    if: github.repository == 'RollNuts/mihassei-news' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.caster_preview
    # Legacy CPU torch is incompatible with glibc in the moving latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NEWS_CASTER_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && 'true' || 'false' }}
      CASTER_SOURCE_RUN: ${{ inputs.caster_source_run }}
      CASTER_SOURCE_MANIFEST: ${{ inputs.caster_source_manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare FFmpeg only for this manual preview
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          if [[ -n "$CASTER_SOURCE_RUN" || -n "$CASTER_SOURCE_MANIFEST" ]] && ! fc-match 'Noto Sans CJK JP' | grep -q 'NotoSansCJK'; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi
      - name: Generate one manual caster preview only while image automation is active
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/free-cpu-scenes.yml" --jq '.state')"
          if [[ "$state" != "active" ]]; then
            echo "Image automation is not active; refusing the caster preview." >&2
            exit 1
          fi
          if [[ -n "${CASTER_SOURCE_MANIFEST:-}" ]]; then
            if [[ -n "${CASTER_SOURCE_RUN:-}" ]]; then
              echo "Supply only one caster source." >&2
              exit 1
            fi
            python scripts/compose_caster_preview.py --run --source-manifest "$CASTER_SOURCE_MANIFEST" --output "$RUNNER_TEMP/news-caster-composition"
          elif [[ -n "${CASTER_SOURCE_RUN:-}" ]]; then
            python scripts/compose_caster_preview.py --run --source-run "$CASTER_SOURCE_RUN" --output "$RUNNER_TEMP/news-caster-composition"
          else
            python scripts/news_caster_preview.py --run --portrait assets/casters/newsreader-preview.jpg --portrait-receipt assets/casters/newsreader-preview.json --output "$RUNNER_TEMP/news-caster-preview"
          fi
      - name: Make one small contact sheet from the composed preview for visual QA
        if: inputs.caster_source_run != '' || inputs.caster_source_manifest != ''
        run: |
          movie="$RUNNER_TEMP/news-caster-composition/news-preview.mp4"
          if [[ -f "$movie" ]]; then
            ffmpeg -nostdin -v error -threads 1 -filter_threads 1 -i "$movie" \
              -vf 'fps=2,scale=480:270,tile=4x4' -frames:v 1 -threads 1 -an -q:v 5 -n \
              "$RUNNER_TEMP/news-caster-composition/qa-contact-sheet.jpg"
          fi
      - name: Keep only bounded preview media and its receipt for one day
        if: always() && inputs.caster_source_run == '' && inputs.caster_source_manifest == ''
        uses: actions/upload-artifact@v4
        with:
          name: news-caster-preview-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/news-caster-preview/presenter-preview.mp4
            ${{ runner.temp }}/news-caster-preview/narration-full.wav
            ${{ runner.temp }}/news-caster-preview/narration-three-seconds.wav
            ${{ runner.temp }}/news-caster-preview/receipt.json
      - name: Keep only the composed news preview and its receipt for one day
        if: always() && (inputs.caster_source_run != '' || inputs.caster_source_manifest != '')
        uses: actions/upload-artifact@v4
        with:
          name: news-caster-composition-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/news-caster-composition/news-preview.mp4
            ${{ runner.temp }}/news-caster-composition/receipt.json
            ${{ runner.temp }}/news-caster-composition/qa-contact-sheet.jpg

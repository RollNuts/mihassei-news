name: Free Nejimachi X Manga

on:
  push:
    branches: [main]
    paths:
      - "social-bot/posts.json"
      - "social-bot/render.py"
      - "social-bot/render_ip.py"
      - "social-bot/ip/**"
      - "social-bot/validate.py"
      - ".github/workflows/free-surreal-x.yml"
  pull_request:
    paths:
      - "social-bot/**"
      - ".github/workflows/free-surreal-x.yml"
  workflow_dispatch:
  schedule:
    # 09:23 JST daily. Buffer determines the actual X publication time.
    - cron: "23 0 * * *"

permissions:
  contents: write

concurrency:
  group: free-surreal-x
  cancel-in-progress: false

jobs:
  build-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify immutable prior canon before any manga or publishing
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CANON_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python social-bot/ip/test_history_guard.py
          python social-bot/ip/history_guard.py
          python social-bot/ip/art_history_guard.py

      - name: Install free rendering dependencies
        run: |
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          python -m pip install --disable-pip-version-check "Pillow==12.0.0"

      - name: Generate original variable-panel manga PNGs (no AI API)
        run: |
          python social-bot/render.py
          python social-bot/render_ip.py
          python social-bot/ip/ink_storyboard.py
          python social-bot/ip/remaster_early.py

      - name: Validate variable-panel acting and drawing (offline)
        run: python -m unittest discover -s social-bot/ip -p 'test_art_readability.py' -v

      - name: Verify hand-ink composition and original character shapes
        run: python -m unittest discover -s social-bot/ip -p 'test_ink_storyboard.py' -v

      - name: Verify safe image migration and design tests (offline only)
        run: python social-bot/ip/test_swap_queued_media.py

      - name: Validate post and image inventory
        run: python social-bot/validate.py

      - name: Commit new assets (never on PRs)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore(social): render latest four-panel comics [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upgrade exactly two already queued manga images (one time)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          ENABLE_MEDIA_REMASTER: "true"
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: |
          test -s social-bot/assets/nejimachi-001-morning-ink-v1.png
          test -s social-bot/assets/nejimachi-002-blue-sky-ink-v1.png
          python social-bot/ip/swap_queued_media.py

      - name: Preserve once-only remaster migration audit
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -f social-bot/ip/ink_remaster_delivery.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add social-bot/ip/ink_remaster_delivery.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(social): record completed Buffer image remaster [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Queue canonical Nejimachi serial episodes in Buffer (opt-in)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          ENABLE_X_BOT: ${{ vars.ENABLE_X_BOT }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python social-bot/publish.py

      - name: Save post ledger, even if queue request failed partway
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-bot/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(social): record Buffer queue submissions [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: One-time inspect Cloudflare build connection
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  checks: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: List Workers Build checks, recent pushes and public revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          echo '===== Recent main commits and status checks ====='
          gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&per_page=10" --jq '.[].sha' >/tmp/commitids
          while read -r sha; do
            echo "COMMIT $sha"
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
              --jq '.check_runs[] | [.name,.status,(.conclusion // "pending")] | @tsv' | head -12
          done < /tmp/commitids
          echo '===== Prior known live commit ====='
          gh api "repos/$GITHUB_REPOSITORY/commits/bdc5beb515b94d6b59ff61d3dd6675e2f511b70d/check-runs" \
            --jq '.check_runs[] | [.name,.status,(.conclusion // "pending")] | @tsv' | head -15
          echo '===== Recent GitHub Actions main workflow runs ====='
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=20" \
            --jq '.workflow_runs[] | [.name,.status,(.conclusion // "pending"),.head_sha] | @tsv' | head -20
          echo '===== GitHub Deployment records (if any) ====='
          gh api "repos/$GITHUB_REPOSITORY/deployments?per_page=8" --jq '.[] | [.sha,.environment] | @tsv' | head -8
          echo '===== Live revision ====='
          curl -sSL --compressed --max-time 12 'https://veripsa.com/build-revision.txt'
          echo
          echo 'Read-only diagnostics complete'

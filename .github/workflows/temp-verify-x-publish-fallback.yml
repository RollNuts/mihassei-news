name: Temporary verify X article publish fallback
on:
  push:
    branches: [fix/x-article-publish-fallback-20261104]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify article promotion fallback offline
        run: |
          python -m unittest discover -s social-bot/article-picks -p 'test_dispatch.py' -v
          python -m unittest discover -s tests -p 'test_x_workflow.py' -v
          python -m py_compile social-bot/article-picks/dispatch.py
